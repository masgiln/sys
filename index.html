<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THPAL | Production Profile & Operations</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- React & Modern Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Upgraded to Babel 7 to support modern React JSX syntax -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* =========================================
           THEME & CSS VARIABLES (5 SWITCHABLE PALETTES)
           ========================================= */
        :root,
        [data-theme="magenta-teal"] {
            --bg-base: #FFFFFF;
            --bg-panel: #F6F7FB; 
            --accent-pink: #FF69B4;
            --accent-teal: #069494; 
            --accent-cyan: #00F0FF;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --text-main: #069494;       
            --text-muted: rgba(6, 148, 148, 0.7); 
            --border-light: rgba(6, 148, 148, 0.15);
            --border-panel: rgba(6, 148, 148, 0.25);
            --theme-preview-1: #FF69B4;
            --theme-preview-2: #069494;
        }

        [data-theme="amber-graphite"] {
            --bg-base: #FFFFFF;
            --bg-panel: #F7F5F2;
            --accent-pink: #E8871E;
            --accent-teal: #2B2D34;
            --accent-cyan: #F2B441;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --text-main: #2B2D34;
            --text-muted: rgba(43, 45, 52, 0.7);
            --border-light: rgba(43, 45, 52, 0.15);
            --border-panel: rgba(43, 45, 52, 0.25);
            --theme-preview-1: #E8871E;
            --theme-preview-2: #2B2D34;
        }

        [data-theme="emerald-slate"] {
            --bg-base: #FFFFFF;
            --bg-panel: #F3F7F5;
            --accent-pink: #12855A;
            --accent-teal: #22403A;
            --accent-cyan: #34C795;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --text-main: #22403A;
            --text-muted: rgba(34, 64, 58, 0.7);
            --border-light: rgba(34, 64, 58, 0.15);
            --border-panel: rgba(34, 64, 58, 0.25);
            --theme-preview-1: #12855A;
            --theme-preview-2: #22403A;
        }

        [data-theme="crimson-navy"] {
            --bg-base: #FFFFFF;
            --bg-panel: #F6F7FA;
            --accent-pink: #D6294A;
            --accent-teal: #1B2A4A;
            --accent-cyan: #4E8BFF;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --text-main: #1B2A4A;
            --text-muted: rgba(27, 42, 74, 0.7);
            --border-light: rgba(27, 42, 74, 0.15);
            --border-panel: rgba(27, 42, 74, 0.25);
            --theme-preview-1: #D6294A;
            --theme-preview-2: #1B2A4A;
        }

        [data-theme="violet-charcoal"] {
            --bg-base: #FFFFFF;
            --bg-panel: #F7F6FA;
            --accent-pink: #8B4FE0;
            --accent-teal: #302B3D;
            --accent-cyan: #B98CFF;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --text-main: #302B3D;
            --text-muted: rgba(48, 43, 61, 0.7);
            --border-light: rgba(48, 43, 61, 0.15);
            --border-panel: rgba(48, 43, 61, 0.25);
            --theme-preview-1: #8B4FE0;
            --theme-preview-2: #302B3D;
        }

        :root {
            --font-sans: 'Inter', sans-serif;
            --font-tech: 'Chakra Petch', sans-serif;
            --transition-fast: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-smooth: 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            --shadow-soft: 0 10px 35px rgba(6, 148, 148, 0.08);
            --shadow-glow: 0 8px 25px rgba(255, 105, 180, 0.25);
        }

        html { scroll-behavior: smooth; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-main);
            font-size: clamp(12px, 1vw, 14px);
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        a { color: var(--accent-pink); text-decoration: none; transition: var(--transition-fast); }
        a:hover { color: var(--accent-cyan); }
        .container { max-width: 1440px; margin: 0 auto; position: relative; }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* TELEMETRY TICKER */
        .ticker-wrap {
            width: 100%; background: var(--accent-pink);
            height: 35px; overflow: hidden; display: flex; align-items: center; position: relative; z-index: 1100;
            transition: background 0.4s ease;
        }
        .ticker {
            display: inline-block; white-space: nowrap; padding-right: 100%;
            animation: ticker 40s linear infinite; font-family: var(--font-tech); font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #FFFFFF; text-transform: uppercase;
        }
        .ticker span { margin-right: 50px; display: inline-flex; align-items: center; gap: 8px; }
        .ticker span.highlight { color: var(--accent-cyan); text-shadow: 0 0 5px rgba(0,240,255,0.5); }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        /* HEADER */
        header { 
            padding: clamp(15px, 2vw, 25px) clamp(20px, 4vw, 45px) 0; position: sticky; top: 0; z-index: 1000; 
            background: var(--bg-glass); backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--border-light);
            box-shadow: 0 4px 20px rgba(6, 148, 148, 0.05);
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .top-row { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 20px; border-bottom: 1px solid var(--border-light); flex-wrap: wrap; gap: 20px; }
        
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon svg { width: clamp(35px, 4vw, 45px); height: clamp(35px, 4vw, 45px); fill: var(--accent-pink); filter: drop-shadow(0 0 8px rgba(255,105,180,0.3)); }
        .logo h1 { font-family: var(--font-tech); font-size: clamp(22px, 3vw, 30px); font-weight: 700; letter-spacing: 2px; line-height: 1; margin: 0; color: var(--accent-teal); }
        .logo h1 strong { color: var(--accent-pink); }
        .logo-sub { display: block; font-size: clamp(9px, 1vw, 10px); color: var(--accent-teal); opacity: 0.7; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; font-weight: 600;}

        .search-util { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .search-all { background: var(--bg-panel); border: 1px solid var(--border-panel); color: var(--text-main); padding: 10px 18px; border-radius: 4px; width: clamp(200px, 20vw, 250px); outline: none; transition: var(--transition-fast); }
        .search-all:focus { border-color: var(--accent-pink); box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.15); background: #FFFFFF; }
        
        .user-status { background: var(--accent-teal); color: #FFFFFF; padding: 9px 18px; border-radius: 4px; display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: 1px; transition: 0.3s;}
        .user-status:hover { background: var(--accent-pink); }
        .status-dot { width: 8px; height: 8px; background: var(--accent-cyan); border-radius: 50%; box-shadow: 0 0 8px var(--accent-cyan); }

        /* THEME SWITCHER */
        .theme-switcher { position: relative; }
        .theme-trigger {
            display: flex; align-items: center; gap: 8px; background: var(--bg-panel); border: 1px solid var(--border-panel);
            padding: 9px 14px; border-radius: 4px; cursor: pointer; transition: var(--transition-fast);
        }
        .theme-trigger:hover { border-color: var(--accent-pink); }
        .theme-swatch-pair { display: flex; }
        .theme-swatch-pair span { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
        .theme-swatch-pair span:nth-child(2) { margin-left: -4px; }
        .theme-trigger-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-main); text-transform: uppercase; }
        .theme-panel {
            position: absolute; top: 120%; right: 0; background: #FFFFFF; border: 1px solid var(--border-light);
            border-top: 4px solid var(--accent-pink); border-radius: 8px; box-shadow: var(--shadow-soft);
            padding: 14px; min-width: 230px; z-index: 2000; opacity: 0; visibility: hidden; transform: translateY(10px);
            transition: 0.3s cubic-bezier(0.19,1,0.22,1);
        }
        .theme-panel.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .theme-panel-title { font-family: var(--font-tech); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent-teal); margin-bottom: 10px; font-weight: 700; }
        .theme-option { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: var(--transition-fast); border: 1px solid transparent; margin-bottom: 4px; }
        .theme-option:hover { background: var(--bg-panel); }
        .theme-option.active { border-color: var(--accent-pink); background: var(--bg-panel); }
        .theme-option .swatch-group { display: flex; }
        .theme-option .swatch-group span { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.08); }
        .theme-option .swatch-group span:nth-child(2) { margin-left: -6px; }
        .theme-option .swatch-group span:nth-child(3) { margin-left: -6px; }
        .theme-option-name { font-size: 12px; font-weight: 600; color: var(--text-main); }
        .theme-option-check { margin-left: auto; width: 14px; height: 14px; fill: var(--accent-pink); opacity: 0; }
        .theme-option.active .theme-option-check { opacity: 1; }

        /* NAV MENU */
        .mobile-menu-btn { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 10px; }
        .mobile-menu-btn span { width: 25px; height: 3px; background-color: var(--accent-teal); border-radius: 2px; transition: var(--transition-fast); }
        .mobile-menu-btn.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); background-color: var(--accent-pink); }
        .mobile-menu-btn.open span:nth-child(2) { opacity: 0; }
        .mobile-menu-btn.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); background-color: var(--accent-pink); }

        .main-nav { padding: 10px 0; transition: max-height 0.4s ease-in-out; overflow: visible; }
        .nav-list { display: flex; justify-content: space-between; list-style: none; gap: 10px; flex-wrap: wrap; }
        .nav-item { position: relative; padding: 12px 5px; flex: 1; text-align: center; }
        
        .nav-item > a { 
            color: var(--accent-teal); font-family: var(--font-tech); font-weight: 700; font-size: clamp(12px, 1.2vw, 14px); 
            text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition-fast); cursor: pointer;
        }
        .nav-item > a svg { width: 16px; height: 16px; fill: var(--accent-pink); transition: var(--transition-fast); }
        .nav-item:hover > a { color: var(--accent-pink); }
        .nav-item:hover > a svg { transform: translateY(-3px); fill: var(--accent-cyan); }

        /* DROPDOWNS */
        .dropdown { 
            position: absolute; top: 120%; left: 50%; 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(15px);
            min-width: 270px; border-radius: 8px; 
            border: 1px solid var(--border-light); 
            border-top: 4px solid var(--accent-pink);
            box-shadow: var(--shadow-soft); 
            opacity: 0; visibility: hidden; 
            transform-origin: top center;
            transform: translateX(-50%) translateY(15px) scaleY(0.9); 
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s cubic-bezier(0.19, 1, 0.22, 1); 
            list-style: none; padding: 10px 0; z-index: 9999; text-align: left;
        }
        .nav-item:hover .dropdown { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0) scaleY(1); }
        
        .dropdown li { position: relative; border-bottom: 1px solid var(--border-light); }
        .dropdown li:last-child { border-bottom: none; }
        
        .dropdown li a { 
            display: flex; justify-content: space-between; align-items: center; padding: 14px 25px; 
            color: var(--accent-teal); font-size: 13px; font-weight: 700; text-transform: uppercase; 
            letter-spacing: 1px; transition: var(--transition-fast); border-left: 3px solid transparent; 
            position: relative; z-index: 1;
        }
        .dropdown li a::before {
            content: ''; position: absolute; top: 0; left: 0; width: 0; height: 100%;
            background: linear-gradient(90deg, var(--bg-panel), transparent);
            z-index: -1; transition: width 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .dropdown li a:hover::before { width: 100%; }
        .dropdown li a:hover { color: var(--accent-pink); border-left-color: var(--accent-teal); padding-left: 32px; }

        .chevron-icon { width: 14px; height: 14px; fill: var(--accent-teal); transition: var(--transition-fast); }
        .dropdown li.has-submenu:hover .chevron-icon { fill: var(--accent-pink); transform: translateX(3px); }

        .sub-dropdown {
            position: absolute; top: -10px; left: 100%; margin-left: 5px; 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(15px); min-width: 250px;
            border-radius: 8px; border: 1px solid var(--border-light); 
            border-left: 4px solid var(--accent-cyan);
            box-shadow: var(--shadow-soft); 
            opacity: 0; visibility: hidden; 
            transform-origin: left center;
            transform: translateX(15px) scale(0.95); 
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s cubic-bezier(0.19, 1, 0.22, 1); 
            list-style: none; padding: 10px 0; z-index: 10000;
        }
        .nav-item:nth-last-child(1) .sub-dropdown, .nav-item:nth-last-child(2) .sub-dropdown {
            left: auto; right: 100%; margin-left: 0; margin-right: 5px; transform-origin: right center; 
            transform: translateX(-15px) scale(0.95); border-left: 1px solid var(--border-light); 
            border-right: 4px solid var(--accent-cyan);
        }
        .dropdown li.has-submenu:hover .sub-dropdown { opacity: 1; visibility: visible; transform: translateX(0) scale(1); }

        /* ADVANCED SLIDER */
        .slider-wrapper { 
            position: relative; width: 100%; height: clamp(500px, 60vw, 750px); 
            overflow: hidden; background: #000; border-bottom: 3px solid var(--accent-pink); 
        }
        .slide { 
            position: absolute; inset: 0; z-index: 1; 
            opacity: 0; visibility: hidden; 
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
        }
        .slide.active { opacity: 1; visibility: visible; z-index: 2; }
        
        .slide-bg { width: 100%; height: 100%; position: absolute; inset: 0; overflow: hidden; background: #000; }
        .slide-bg img { 
            width: 100%; height: 100%; object-fit: cover; opacity: 0; 
            transform: scale(1.2) rotate(2deg); filter: blur(15px);
            transition: transform 9s cubic-bezier(0.19, 1, 0.22, 1), filter 2s ease, opacity 1s ease; 
        }
        .slide.active .slide-bg img { transform: scale(1) rotate(0deg); filter: blur(0px); opacity: 0.65; }
        
        .slide-content { 
            position: absolute; top: 50%; left: clamp(20px, 5vw, 80px); 
            transform: translateY(-50%); z-index: 3; 
            border-left: 6px solid var(--accent-pink); 
            padding-left: clamp(15px, 3vw, 30px); max-width: 800px; 
        }
        
        .slide-content h2, .slide-content p { 
            clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%); 
            transform: translateY(40px); opacity: 0; 
        }
        .slide-content h2 { 
            font-family: var(--font-tech); font-size: clamp(36px, 5vw, 64px); 
            font-weight: 700; color: #FFFFFF; text-shadow: 0 4px 20px rgba(0,0,0,0.8); 
            line-height: 1.1; margin-bottom: 12px; 
            transition: clip-path 1s cubic-bezier(0.77, 0, 0.175, 1) 0.5s, transform 1s cubic-bezier(0.77, 0, 0.175, 1) 0.5s, opacity 1s ease 0.5s;
        }
        .slide-content p { 
            font-size: clamp(13px, 1.5vw, 16px); font-weight: 700; text-transform: uppercase; 
            letter-spacing: clamp(2px, 0.5vw, 5px); color: var(--accent-cyan); text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            transition: clip-path 1s cubic-bezier(0.77, 0, 0.175, 1) 0.7s, transform 1s cubic-bezier(0.77, 0, 0.175, 1) 0.7s, opacity 1s ease 0.7s;
        }
        .slide.active .slide-content h2, .slide.active .slide-content p { 
            clip-path: polygon(0 -20%, 120% -20%, 120% 120%, 0 120%);
            transform: translateY(0); opacity: 1; 
        }

        .slider-controls {
            position: absolute; bottom: clamp(30px, 5vw, 50px); right: clamp(30px, 5vw, 80px);
            display: flex; align-items: center; gap: 20px; z-index: 10;
        }
        .slider-nav-btn { 
            width: clamp(45px, 5vw, 55px); height: clamp(45px, 5vw, 55px); 
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); 
            border: 2px solid var(--accent-cyan); color: #FFFFFF; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1); 
        }
        .slider-nav-btn svg { width: 20px; height: 20px; fill: currentColor; transition: transform 0.3s ease; }
        .slider-nav-btn:hover { background: var(--accent-pink); border-color: var(--accent-pink); box-shadow: var(--shadow-glow); transform: scale(1.05); }
        .slider-nav-btn:hover svg { transform: scale(1.2); }
        
        .slider-counter { font-family: var(--font-tech); font-size: clamp(18px, 2vw, 24px); font-weight: 700; color: #FFFFFF; letter-spacing: 2px; display: flex; align-items: baseline; gap: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .slider-counter span { font-size: clamp(12px, 1.2vw, 14px); color: var(--accent-cyan); font-weight: 500; }

        .slider-progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 5px; background: rgba(255,255,255,0.2); z-index: 10; }
        .slider-progress-bar { height: 100%; background: var(--accent-pink); width: 0%; box-shadow: 0 0 15px var(--accent-pink); }

        /* DASHBOARD GRID */
        .main-content { display: grid; grid-template-columns: 2fr 1fr; gap: clamp(20px, 3vw, 30px); padding: clamp(20px, 4vw, 40px) clamp(20px, 4vw, 45px); position: relative; z-index: 20; margin-top: clamp(-30px, -5vw, -60px); }
        
        .content-panel { 
            background: var(--bg-panel); color: var(--text-main); border-radius: 12px; 
            border: 1px solid var(--border-light); padding: clamp(20px, 3vw, 35px); 
            box-shadow: var(--shadow-soft); position: relative; overflow: hidden; 
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .content-panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, var(--accent-pink), var(--accent-teal)); }
        
        .section-header { border-bottom: 2px solid rgba(6, 148, 148, 0.1); padding-bottom: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .section-header h3 { font-family: var(--font-tech); font-size: clamp(18px, 2vw, 22px); display: flex; align-items: center; gap: 12px; letter-spacing: 1px; color: var(--accent-teal); font-weight: 700; }
        .section-header h3 svg { width: 26px; height: 26px; fill: var(--accent-pink); }

        /* BULLETIN BOARD */
        .bulletin-add-btn {
            background: var(--accent-pink); color: #fff; border: none; padding: 9px 16px; border-radius: 20px;
            font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: var(--transition-fast);
        }
        .bulletin-add-btn:hover { background: var(--accent-teal); box-shadow: var(--shadow-glow); transform: translateY(-2px); }
        .bulletin-add-btn svg { width: 14px; height: 14px; fill: currentColor; }

        .bulletin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-bottom: 15px; }
        .bulletin-card {
            background: #FFFFFF; border: 1px solid var(--border-light); border-radius: 10px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(6,148,148,0.05); transition: var(--transition-smooth); display: flex; flex-direction: column;
        }
        .bulletin-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-soft); border-color: var(--accent-pink); }
        .bulletin-card-body { display: flex; gap: 14px; padding: 16px; flex: 1; }
        .bulletin-card-img {
            flex-shrink: 0; width: 84px; height: 84px; border-radius: 8px; overflow: hidden;
            background: var(--bg-panel); border: 1px solid var(--border-light);
        }
        .bulletin-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .bulletin-card-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .bulletin-card-tag {
            font-size: 9.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--accent-pink);
            margin-bottom: 4px;
        }
        .bulletin-card-title { font-family: var(--font-tech); font-size: 14.5px; font-weight: 700; color: var(--accent-teal); line-height: 1.3; margin-bottom: 6px; }
        .bulletin-card-desc {
            font-size: 12px; color: var(--text-main); line-height: 1.55; opacity: 0.85;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .bulletin-card-desc.expanded { -webkit-line-clamp: unset; overflow: visible; }
        .bulletin-card-footer {
            border-top: 1px solid var(--border-light); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-panel);
        }
        .bulletin-card-date { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }
        .bulletin-see-more {
            background: none; border: none; color: var(--accent-pink); font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
            text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0;
        }
        .bulletin-see-more:hover { color: var(--accent-cyan); }
        .bulletin-see-more svg { width: 11px; height: 11px; fill: currentColor; transition: transform 0.3s ease; }
        .bulletin-see-more.open svg { transform: rotate(180deg); }
        .bulletin-card-actions {
            display: flex; gap: 6px; padding: 8px 16px; border-top: 1px solid var(--border-light);
        }
        .bulletin-mini-btn {
            flex: 1; background: #FFFFFF; border: 1px solid var(--border-panel); color: var(--accent-teal);
            padding: 6px 4px; border-radius: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px;
            text-transform: uppercase; cursor: pointer; transition: var(--transition-fast);
        }
        .bulletin-mini-btn:hover { background: var(--accent-teal); color: #fff; border-color: var(--accent-teal); }
        .bulletin-mini-btn.danger:hover { background: #e74c3c; border-color: #e74c3c; }
        .bulletin-empty { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }

        /* MODAL FIELDS */
        .field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--accent-teal); margin-bottom: 6px; margin-top: 14px; }
        .field-label:first-child { margin-top: 0; }
        .field-input, .field-textarea, .field-select {
            width: 100%; padding: 10px 13px; border: 1px solid var(--border-panel); border-radius: 5px;
            font-family: var(--font-sans); color: var(--text-main); outline: none; transition: 0.3s; background: #fff;
        }
        .field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--accent-pink); box-shadow: 0 0 0 3px rgba(255,105,180,0.1); }
        .field-textarea { resize: vertical; min-height: 80px; font-family: var(--font-sans); }
        .modal-btn-row { display: flex; gap: 10px; margin-top: 22px; }
        .btn-secondary {
            flex: 1; background: #fff; border: 1px solid var(--border-panel); color: var(--accent-teal); padding: 12px;
            border-radius: 4px; font-family: var(--font-tech); font-weight: 700; letter-spacing: 1px; cursor: pointer;
            transition: 0.3s; text-transform: uppercase;
        }
        .btn-secondary:hover { border-color: var(--accent-pink); color: var(--accent-pink); }
        .modal-content.wide { max-width: 560px; max-height: 88vh; overflow-y: auto; }
        
        /* LOGIN / AUTH SECTION */
        .auth-container { background: #FFFFFF; border: 1px solid var(--border-light); border-radius: 8px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(6,148,148,0.05); }
        .auth-container input { width: 100%; padding: 10px 15px; margin-bottom: 12px; border: 1px solid var(--border-panel); border-radius: 4px; font-family: var(--font-sans); color: var(--text-main); outline: none; transition: 0.3s; }
        .auth-container input:focus { border-color: var(--accent-pink); box-shadow: 0 0 0 3px rgba(255,105,180,0.1); }
        .btn-primary { width: 100%; background: var(--accent-teal); color: #FFF; padding: 12px; border: none; border-radius: 4px; font-family: var(--font-tech); font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-pink); box-shadow: var(--shadow-glow); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-link { background: none; border: none; color: var(--accent-pink); font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; display: block; text-align: center; width: 100%; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-link:hover { color: var(--accent-cyan); text-decoration: underline; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); z-index: 10000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.4s ease; padding: 20px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--bg-base); padding: 40px; border-radius: 12px; width: 90%; max-width: 450px; border-top: 5px solid var(--accent-pink); box-shadow: 0 25px 50px rgba(0,0,0,0.3); transform: translateY(30px) scale(0.95); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative; }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; color: var(--accent-teal); cursor: pointer; transition: 0.2s; }
        .modal-close:hover { color: var(--accent-pink); transform: rotate(90deg); }
        .modal-view-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 18px; border: 1px solid var(--border-light); }
        .modal-view-tag { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--accent-pink); margin-bottom: 8px; }
        .modal-view-desc { font-size: 13.5px; line-height: 1.7; color: var(--text-main); margin-top: 10px; text-align: justify; }
        .modal-view-date { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-light); }

        /* MVG & INFO PARAGRAPHS */
        .mvg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 45px; }
        .mvg-card { background: #FFFFFF; border: 1px solid var(--border-light); border-top: 4px solid var(--accent-teal); padding: clamp(20px, 2vw, 25px); border-radius: 8px; transition: var(--transition-smooth); box-shadow: 0 4px 15px rgba(6,148,148,0.05); }
        .mvg-card:hover { transform: translateY(-5px); border-top-color: var(--accent-pink); box-shadow: var(--shadow-soft); }
        .mvg-card svg { width: 40px; height: 40px; margin-bottom: 15px; transition: var(--transition-fast); }
        .mvg-card:hover svg { transform: scale(1.1); fill: var(--accent-pink) !important; }
        .mvg-card h4 { font-family: var(--font-tech); font-size: clamp(16px, 1.5vw, 18px); margin-bottom: 12px; color: var(--accent-teal); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .mvg-card p { font-size: clamp(12.5px, 1vw, 13.5px); color: var(--text-main); line-height: 1.6; font-weight: 400; }

        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 35px 25px; }
        .info-paragraph { position: relative; padding-left: 20px; border-left: 3px solid var(--border-light); transition: var(--transition-fast); }
        .info-paragraph:hover { border-left-color: var(--accent-pink); background: linear-gradient(90deg, rgba(255, 105, 180, 0.03), transparent); }
        .info-paragraph:nth-child(even):hover { border-left-color: var(--accent-teal); background: linear-gradient(90deg, rgba(6, 148, 148, 0.03), transparent); }
        .info-paragraph h4 { display: flex; align-items: center; gap: 10px; font-size: clamp(15px, 1.5vw, 17px); font-family: var(--font-tech); color: var(--accent-teal); margin-bottom: 12px; font-weight: 700; letter-spacing: 0.5px; }
        .info-paragraph h4 svg { width: 22px; height: 22px; fill: var(--accent-pink); }
        .info-paragraph p { font-size: clamp(12.5px, 1.1vw, 14px); color: var(--text-main); line-height: 1.7; margin-bottom: 0; text-align: justify; font-weight: 400; }

        /* CALENDAR */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: #FFFFFF; padding: 18px; border-radius: 8px; border: 1px solid var(--border-light); margin-bottom: 15px; box-shadow: 0 4px 15px rgba(6,148,148,0.04); }
        .day-name { text-align: center; font-size: 11px; font-weight: 800; color: var(--accent-pink); padding-bottom: 10px; text-transform: uppercase; }
        .day { background: var(--bg-panel); color: var(--accent-teal); aspect-ratio: 1; border-radius: 4px; display: flex; align-items: flex-start; padding: 6px; font-family: var(--font-tech); font-size: clamp(12px, 1vw, 14px); position: relative; border: 1px solid transparent; cursor: pointer; transition: var(--transition-fast); font-weight: 600; }
        .day:hover { border-color: var(--accent-pink); background: rgba(255, 105, 180, 0.1); transform: scale(1.05); z-index: 5; }
        .day.past { color: rgba(6, 148, 148, 0.4); background: #FFFFFF; border: 1px dashed var(--border-light); }
        .day.current { background: var(--accent-pink); color: #FFFFFF; font-weight: 800; box-shadow: 0 4px 10px rgba(255, 105, 180, 0.4); border: none; }
        .shift-dot { width: 6px; height: 6px; border-radius: 50%; position: absolute; bottom: 6px; }
        .shift-ms { background: var(--accent-pink); left: 6px; }
        .shift-hpal { background: var(--accent-cyan); left: 16px; }
        .day.current .shift-ms, .day.current .shift-hpal { background: #FFFFFF; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
        
        .calendar-details { background: #FFFFFF; border-left: 4px solid var(--accent-cyan); padding: 15px; border-radius: 0 8px 8px 0; margin-bottom: 40px; box-shadow: 0 4px 10px rgba(6,148,148,0.05); display: none; animation: fadeIn 0.4s ease; }
        .calendar-details.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* PEOPLE GRID */
        .people-section { padding: 0 clamp(20px, 4vw, 45px) 10px; margin-bottom: clamp(30px, 4vw, 50px); }
        .people-panel { position: relative; }
        .people-panel .section-header { margin-bottom: 8px; }
        .people-subtitle { font-size: 12.5px; color: var(--text-muted); margin-bottom: 25px; font-weight: 500; }
        .people-count-badge { display: inline-flex; align-items: center; justify-content: center; margin-left: 10px; background: rgba(255,105,180,0.12); color: var(--accent-pink); font-size: 10.5px; font-weight: 800; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.5px; font-family: var(--font-sans); }
        .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; }
        .people-card { background: #FFFFFF; border: 1px solid var(--border-light); border-radius: 10px; padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; box-shadow: 0 4px 15px rgba(6,148,148,0.05); transition: var(--transition-smooth); position: relative; animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
        .people-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-soft); border-color: var(--accent-pink); }
        @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .people-photo-wrap { width: 78px; height: 78px; border-radius: 50%; overflow: hidden; margin-bottom: 12px; flex-shrink: 0; border: 3px solid var(--bg-panel); box-shadow: 0 0 0 2px var(--accent-teal); transition: var(--transition-fast); position: relative; }
        .people-card:hover .people-photo-wrap { box-shadow: 0 0 0 2px var(--accent-pink); }
        .people-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .people-rank-badge { position: absolute; top: -4px; right: -4px; width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-pink), var(--accent-cyan)); color: #fff; font-family: var(--font-tech); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.25); border: 2px solid #fff; }
        .people-name { font-family: var(--font-tech); font-size: 13px; font-weight: 700; color: var(--accent-teal); line-height: 1.35; margin-bottom: 4px; }
        .people-role { font-size: 10.5px; color: var(--text-muted); font-weight: 600; line-height: 1.3; margin-bottom: 8px; min-height: 13px; }
        .people-tag { font-size: 9px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; padding: 3px 10px; border-radius: 12px; color: #fff; background: var(--accent-teal); }
        .people-tag.tag-pink { background: var(--accent-pink); }
        .people-tag.tag-cyan { background: var(--accent-cyan); color: var(--accent-teal); }
        .people-see-more-row { display: flex; justify-content: center; margin-top: 28px; }
        .people-see-more-btn { background: #FFFFFF; border: 1.5px solid var(--accent-teal); color: var(--accent-teal); padding: 11px 30px; border-radius: 24px; font-family: var(--font-tech); font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: var(--transition-fast); display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(6,148,148,0.08); }
        .people-see-more-btn:hover { background: var(--accent-teal); color: #fff; box-shadow: var(--shadow-glow); transform: translateY(-2px); }
        .people-see-more-btn svg { width: 13px; height: 13px; fill: currentColor; transition: transform 0.35s ease; }
        .people-see-more-btn.open svg { transform: rotate(180deg); }

        /* PERSON DETAIL MODAL */
        .modal-content.person-modal { max-width: 400px; text-align: center; padding: 45px 35px 35px; }
        .person-modal-photo { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; margin: 0 auto 18px; border: 4px solid var(--bg-panel); box-shadow: 0 0 0 3px var(--accent-pink), var(--shadow-soft); }
        .person-modal-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .person-modal-name { font-family: var(--font-tech); font-size: 20px; font-weight: 700; color: var(--accent-teal); margin-bottom: 5px; }
        .person-modal-role { font-size: 12.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 14px; }
        .person-modal-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; padding: 6px 16px; border-radius: 20px; color: #fff; background: var(--accent-pink); margin-bottom: 20px; }
        .person-modal-tag svg { width: 12px; height: 12px; fill: currentColor; }
        .person-modal-detail-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 9px 2px; border-bottom: 1px dashed var(--border-light); }
        .person-modal-detail-row:last-child { border-bottom: none; }
        .person-modal-detail-label { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
        .person-modal-detail-value { color: var(--text-main); font-weight: 700; text-align: right; }
        .person-modal-note { font-size: 12.5px; color: var(--text-main); line-height: 1.6; margin-top: 16px; text-align: left; background: var(--bg-panel); padding: 14px 16px; border-radius: 8px; border-left: 3px solid var(--accent-cyan); }

        /* SECURE NETWORK — LIVE STATUS + MODAL */
        .netstat-card { background: #FFFFFF; border: 1px solid var(--border-light); border-radius: 8px; padding: 16px 18px; margin-bottom: 25px; cursor: pointer; transition: var(--transition-fast); position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(6,148,148,0.05); }
        .netstat-card:hover { border-color: var(--accent-pink); box-shadow: var(--shadow-glow); transform: translateY(-2px); }
        .netstat-top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .netstat-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-tech); font-size: 13px; font-weight: 700; color: var(--accent-teal); text-transform: uppercase; letter-spacing: 0.6px; }
        .netstat-title svg { width: 17px; height: 17px; }
        .netstat-live-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #1FAA59; background: rgba(31,170,89,0.12); padding: 3px 9px 3px 7px; border-radius: 20px; }
        .netstat-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #1FAA59; animation: netPulse 1.4s infinite; flex-shrink: 0; }
        @keyframes netPulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(31,170,89,0.5); } 50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(31,170,89,0); } }
        .netstat-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .netstat-metric { background: var(--bg-panel); border-radius: 6px; padding: 8px 6px; text-align: center; }
        .netstat-metric-val { font-family: var(--font-tech); font-size: 15px; font-weight: 700; color: var(--accent-teal); line-height: 1.2; transition: color 0.3s ease; }
        .netstat-metric-label { font-size: 8.5px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
        .netstat-foot-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .netstat-foot-row span.netstat-count { color: var(--accent-pink); font-weight: 800; }
        .netstat-view-link { display: flex; align-items: center; gap: 4px; color: var(--accent-teal); font-weight: 700; }
        .netstat-view-link svg { width: 12px; height: 12px; transition: transform 0.25s ease; }
        .netstat-card:hover .netstat-view-link svg { transform: translateX(3px); }

        .modal-content.network-modal { max-width: 560px; width: 92%; text-align: left; padding: 32px 30px 28px; max-height: 85vh; display: flex; flex-direction: column; }
        .netmodal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; padding-right: 30px; }
        .netmodal-title { font-family: var(--font-tech); font-size: 19px; font-weight: 700; color: var(--accent-teal); display: flex; align-items: center; gap: 9px; }
        .netmodal-title svg { width: 22px; height: 22px; }
        .netmodal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }

        .netmodal-tabs { display: flex; gap: 6px; background: var(--bg-panel); padding: 5px; border-radius: 10px; margin-bottom: 18px; flex-shrink: 0; }
        .netmodal-tab { flex: 1; text-align: center; padding: 9px 8px; border-radius: 7px; font-family: var(--font-tech); font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-muted); cursor: pointer; transition: var(--transition-fast); border: none; background: transparent; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .netmodal-tab svg { width: 14px; height: 14px; }
        .netmodal-tab.active { background: #FFFFFF; color: var(--accent-pink); box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
        .netmodal-tab .netmodal-tab-badge { background: var(--accent-teal); color: #fff; font-size: 9px; padding: 1px 6px; border-radius: 10px; }
        .netmodal-tab.active .netmodal-tab-badge { background: var(--accent-pink); }
        .netmodal-body { overflow-y: auto; flex: 1; padding-right: 4px; }
        .netmodal-body::-webkit-scrollbar { width: 5px; }
        .netmodal-body::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
        .netmodal-section-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin: 14px 0 8px; }
        .netmodal-section-label:first-child { margin-top: 0; }
        .netapp-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 8px; transition: background 0.2s ease; }
        .netapp-row:hover { background: var(--bg-panel); }
        .netapp-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--accent-teal); color: #fff; flex-shrink: 0; font-family: var(--font-tech); font-size: 13px; font-weight: 800; }
        .netapp-info { flex: 1; min-width: 0; }
        .netapp-name { font-size: 12.5px; font-weight: 700; color: var(--text-main); }
        .netapp-meta { font-size: 10.5px; color: var(--text-muted); font-weight: 500; }
        .netapp-bandwidth { font-family: var(--font-tech); font-size: 11px; font-weight: 700; color: var(--accent-cyan); text-align: right; flex-shrink: 0; min-width: 52px; transition: opacity 0.25s ease; }
        .netapp-bandwidth-label { font-size: 8.5px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .netconn-row { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border: 1px solid var(--border-light); border-radius: 9px; margin-bottom: 8px; transition: var(--transition-fast); background: #FFFFFF; }
        .netconn-row.is-connected { border-color: rgba(31,170,89,0.35); background: rgba(31,170,89,0.05); }
        .netconn-icon-wrap { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg-panel); color: var(--accent-teal); transition: var(--transition-fast); }
        .netconn-icon-wrap svg { width: 18px; height: 18px; }
        .netconn-row.is-connected .netconn-icon-wrap { background: var(--accent-teal); color: #fff; }
        .netconn-info { flex: 1; min-width: 0; }
        .netconn-name { font-size: 12.5px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .netconn-lock svg { width: 10px; height: 10px; opacity: 0.6; }
        .netconn-meta { font-size: 10.5px; color: var(--text-muted); font-weight: 500; margin-top: 1px; }
        .netconn-signal { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex-shrink: 0; }
        .netconn-signal-bar { width: 3px; background: var(--border-light); border-radius: 1px; }
        .netconn-signal-bar.filled { background: var(--accent-cyan); }

                case 'globe': return <svg {...svgProps}><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>;
                case 'bulletin': return <svg {...svgProps}><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14H7v-2h3v2zm0-4H7v-2h3v2zm0-4H7V7h3v2zm7 8h-5v-2h5v2zm0-4h-5v-2h5v2zm0-4h-5V7h5v2z"/></svg>;
                case 'plus': return <svg {...svgProps}><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>;
                case 'edit': return <svg {...svgProps}><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>;
                case 'trash': return <svg {...svgProps}><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>;
                case 'eye': return <svg {...svgProps}><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>;
                case 'chevronDown': return <svg {...svgProps} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>;
                case 'palette': return <svg {...svgProps}><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.61-.23-1.2-.64-1.67-.08-.1-.13-.21-.13-.33 0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 8 6.5 8 8 8.67 8 9.5 7.33 11 6.5 11zm3-4C8.67 7 8 6.33 8 5.5S8.67 4 9.5 4s1.5.67 1.5 1.5S10.33 7 9.5 7zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 4 14.5 4s1.5.67 1.5 1.5S15.33 7 14.5 7zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>;
                case 'check': return <svg {...svgProps} fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>;
                case 'pin': return <svg {...svgProps}><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>;
                case 'route': return <svg {...svgProps}><path d="M20.5 10.5c0 4.5-8.5 11-8.5 11s-8.5-6.5-8.5-11a8.5 6.5 0 0117 0z" opacity="0"/><path d="M6 20c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0-11c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm12 11c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM7.41 18.59L15 11h3c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .35.07.68.18 1H12L6.59 15.41 8 16.83l-.59 1.76z"/></svg>;
                case 'area': return <svg {...svgProps}><path d="M3 3v18h18V3H3zm16 16H5V5h14v14z"/><path d="M7 7h10v10H7z" opacity="0.5"/></svg>;
                default: return null;
            }
        };

        /* --- THEME DEFINITIONS --- */
        const THEMES = [
            { id: 'magenta-teal', name: 'Magenta Teal', c1: '#FF69B4', c2: '#069494', c3: '#00F0FF' },
            { id: 'amber-graphite', name: 'Amber Graphite', c1: '#E8871E', c2: '#2B2D34', c3: '#F2B441' },
            { id: 'emerald-slate', name: 'Emerald Slate', c1: '#12855A', c2: '#22403A', c3: '#34C795' },
            { id: 'crimson-navy', name: 'Crimson Navy', c1: '#D6294A', c2: '#1B2A4A', c3: '#4E8BFF' },
            { id: 'violet-charcoal', name: 'Violet Charcoal', c1: '#8B4FE0', c2: '#302B3D', c3: '#B98CFF' }
        ];

        const ThemeSwitcher = ({ theme, setTheme }) => {
            const [open, setOpen] = useState(false);
            const wrapRef = useRef(null);
            const active = THEMES.find(t => t.id === theme) || THEMES[0];

            useEffect(() => {
                const onClickOutside = (e) => {
                    if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
                };
                document.addEventListener('mousedown', onClickOutside);
                return () => document.removeEventListener('mousedown', onClickOutside);
            }, []);

            return (
                <div className="theme-switcher" ref={wrapRef}>
                    <div className="theme-trigger" onClick={() => setOpen(o => !o)}>
                        <Icon name="palette" style={{ width: 15, height: 15, fill: 'var(--accent-pink)' }} />
                        <div className="theme-swatch-pair">
                            <span style={{ background: active.c1 }}></span>
                            <span style={{ background: active.c2 }}></span>
                        </div>
                        <span className="theme-trigger-label">Theme</span>
                    </div>
                    <div className={`theme-panel ${open ? 'open' : ''}`}>
                        <div className="theme-panel-title">Color Palette</div>
                        {THEMES.map(t => (
                            <div
                                key={t.id}
                                className={`theme-option ${theme === t.id ? 'active' : ''}`}
                                onClick={() => { setTheme(t.id); setOpen(false); }}
                            >
                                <div className="swatch-group">
                                    <span style={{ background: t.c1 }}></span>
                                    <span style={{ background: t.c2 }}></span>
                                    <span style={{ background: t.c3 }}></span>
                                </div>
                                <span className="theme-option-name">{t.name}</span>
                                <Icon name="check" className="theme-option-check" />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        /* --- DATA STRUCTURES --- */
        const NAV_DATA = [
            {
                title: "MS Area's", icon: "operations",
                dropdown: [
                    { label: "Dezinc Area's (105)", links: ["Dezinc Reactors","105TK05","Polishing Filters A-F","105TK13","105TK08"] },
                    { label: "MS Area's (106)", links: ["106TK01", "MS MS Reators","106TK08","Vacuum & Compressor","Thickener","106TK14"] },
                    { label: "H2S Area's", links: ["Sulfur Area", "H2 Area","Methanol Area","Scrubbers Area","N2 Gen Area"] },
                    { label: "F - Neut Area's", links: ["Extraction Circuit", "Refining Phase"] },
                    { label: "Limestone Area", links: ["Gas Treatment", "Emissions Logging"] }
                ]
            },
            {
                title: "Group", icon: "recovery",
                dropdown: [
                    { label: "Group 1" }, { label: "Group 2" }, { label: "Group 3" }, { label: "Group 4" }
                ]
            },
            {
                title: "PRODUCT QUALITY", icon: "preparation",
                dropdown: [{ label: "Quality Assurance" }, { label: "Quality Reports" }, { label: "Quality Claims" }, { label: "Quality Measures" }]
            },
            {
                title: "Re-Education List", icon: "quality",
                dropdown: [{ label: "Tailing Dams (TSF)" }, { label: "Wastewater Treatment" }, { label: "ISO 14001 Audits" }]
            },
            {
                title: "Systems", icon: "policy",
                dropdown: [{ label: "Inventory System" }, { label: "Safety System" }, { label: "Environmental System" },{ label: "Quality System" }]
            }
        ];

        const HERO_SLIDES = [
            { img: "img/1785732556356.jpg", title: "Mixsulphide Extraction", sub: "Primary Nickel & Cobalt Recovery Line" },
            { img: "img/1785732556344.jpg", title: "High-Pressure Leaching", sub: "Core Autoclave Operations at 250°C" },
            { img: "img/1785732556381.jpg", title: "Chromite Concentrate", sub: "Strategic Byproduct Stockpiling" },
            { img: "img/1785732556333.jpg", title: "Tailings Thickener Array", sub: "Water Recovery & Solid Separation" },
            { img: "img/1785732556371.jpg", title: "Ore Preparation & Washing", sub: "Limonite and Saprolite Feed Setup" },
            { img: "img/1785732556394.jpg", title: "Autoclave Letdown Vessels", sub: "Pressure Stabilization Chambers" },
            { img: "img/1785732556418.jpg", title: "Acid Plant Operations", sub: "Sulfuric Acid Manufacturing" },
            { img: "img/1785732556429.jpg", title: "Wastewater Neutralization", sub: "Environmental pH Balancing" },
            { img: "img/1785732556407.jpg", title: "Bulk Export Loading", sub: "Direct Ship Conveyor Systems" },
            { img: "img/1785732556445.jpg", title: "Scandium Refining Phase", sub: "Advanced Rare Earth Distillation" },
            { img: "img/1785732556461.jpg", title: "Limestone Grinding", sub: "Neutralizing Agent Feed Prep" },
            { img: "img/1785732556473.jpg", title: "Environmental Rehab", sub: "Progressive Mine Site Restoration" },
            { img: "img/1785732556489.jpg", title: "Process Control Room", sub: "24/7 Digital Plant Telemetry" },
            { img: "img/1785732556510.jpg", title: "Laboratory Assays", sub: "Continuous Quality Assurance" },
        ];

        const DEFAULT_BULLETINS = [
            {
                id: 1, tag: "Company Event",
                title: "Annual Safety Milestone Celebration",
                desc: "THPAL marks another year of zero lost-time incidents across the production floor. Join the department-wide gathering at the main pavilion on August 14 to recognize the safety officers, shift leads, and operators who made this milestone possible. Light refreshments and commemorative pins will be distributed to all attendees. Department heads are asked to confirm headcounts by August 10.",
                img: "/img/1785732556489.jpg",
                date: "August 3, 2026"
            },
            {
                id: 2, tag: "Maintenance Notice",
                title: "Scheduled Autoclave 2 Shutdown",
                desc: "Autoclave 2 will undergo a planned 48-hour maintenance shutdown beginning August 9, 6:00 AM. Production will shift entirely to Autoclave 1 and 3 during this window. All shift supervisors should review the revised feed schedule posted on the operations board and coordinate handovers accordingly. Contact the Maintenance Planning Office for any concerns regarding the reduced-capacity period.",
                img: "img/1785732556394.jpg",
                date: "August 1, 2026"
            },
            {
                id: 3, tag: "Community Update",
                title: "SDMP Scholarship Program Now Open",
                desc: "Applications for the 2026-2027 Social Development and Management Program scholarship are now being accepted for qualified dependents of employees and residents of host and neighboring barangays in Claver. The program covers tuition, allowance, and book stipends for selected students. Interested applicants may pick up forms at the Community Relations Office or download them from the internal portal before the September 1 deadline.",
                img: "img/1785732556473.jpg",
                date: "July 29, 2026"
            }
        ];

        const emptyBulletinForm = { tag: "", title: "", desc: "", img: "", date: "" };

        /* --- BULLETIN BOARD --- */
        const BulletinBoard = ({ bulletins, onAdd, onEdit, onDelete }) => {
            const [expandedId, setExpandedId] = useState(null);
            const [modalMode, setModalMode] = useState(null);
            const [activeBulletin, setActiveBulletin] = useState(null);
            const [form, setForm] = useState(emptyBulletinForm);

            const openAdd = () => {
                setForm({ ...emptyBulletinForm, date: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) });
                setModalMode('add');
            };
            const openEdit = (b) => { setActiveBulletin(b); setForm({ tag: b.tag, title: b.title, desc: b.desc, img: b.img, date: b.date }); setModalMode('edit'); };
            const openView = (b) => { setActiveBulletin(b); setModalMode('view'); };
            const openDelete = (b) => { setActiveBulletin(b); setModalMode('delete'); };
            const closeModal = () => { setModalMode(null); setActiveBulletin(null); setForm(emptyBulletinForm); };

            const submitForm = () => {
                if (!form.title.trim()) return;
                if (modalMode === 'add') {
                    onAdd({ ...form, id: Date.now(), tag: form.tag || 'Update', img: form.img || 'img/1785732556489.jpg', date: form.date || new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) });
                } else if (modalMode === 'edit' && activeBulletin) {
                    onEdit(activeBulletin.id, { ...form });
                }
                closeModal();
            };

            const confirmDelete = () => {
                if (activeBulletin) onDelete(activeBulletin.id);
                closeModal();
            };

            const toggleExpand = (id) => setExpandedId(prev => (prev === id ? null : id));

            return (
                <div className="content-panel reveal">
                    <div className="section-header">
                        <h3><Icon name="bulletin" /> Bulletin Board</h3>
                        <button className="bulletin-add-btn" onClick={openAdd}>
                            <Icon name="plus" /> Post Update
                        </button>
                    </div>
                    <p style={{ fontSize: '12.5px', color: 'var(--text-muted)', marginBottom: '20px', marginTop: '-10px' }}>
                        Latest posted events and department announcements. New posts appear here automatically.
                    </p>

                    <div className="bulletin-grid">
                        {bulletins.length === 0 && (
                            <div className="bulletin-empty">No bulletins posted yet. Click "Post Update" to add one.</div>
                        )}
                        {bulletins.map(b => {
                            const isExpanded = expandedId === b.id;
                            return (
                                <div className="bulletin-card" key={b.id}>
                                    <div className="bulletin-card-body">
                                        <div className="bulletin-card-img">
                                            <img src={b.img} alt={b.title} onError={(e) => { e.target.style.display = 'none'; }} />
                                        </div>
                                        <div className="bulletin-card-text">
                                            <div className="bulletin-card-tag">{b.tag}</div>
                                            <div className="bulletin-card-title">{b.title}</div>
                                            <div className={`bulletin-card-desc ${isExpanded ? 'expanded' : ''}`}>{b.desc}</div>
                                        </div>
                                    </div>
                                    <div style={{ padding: '0 16px' }}>
                                        <button className={`bulletin-see-more ${isExpanded ? 'open' : ''}`} onClick={() => toggleExpand(b.id)}>
                                            {isExpanded ? 'See Less' : 'See More'} <Icon name="chevronDown" />
                                        </button>
                                    </div>
                                    <div className="bulletin-card-footer">
                                        <span className="bulletin-card-date">{b.date}</span>
                                    </div>
                                    <div className="bulletin-card-actions">
                                        <button className="bulletin-mini-btn" onClick={() => openView(b)}>View</button>
                                        <button className="bulletin-mini-btn" onClick={() => openEdit(b)}>Edit</button>
                                        <button className="bulletin-mini-btn danger" onClick={() => openDelete(b)}>Delete</button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* ADD / EDIT MODAL */}
                    <div className={`modal-overlay ${(modalMode === 'add' || modalMode === 'edit') ? 'active' : ''}`} onClick={(e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); }}>
                        <div className="modal-content wide">
                            <button className="modal-close" onClick={closeModal}>×</button>
                            <h3 style={{ fontFamily: 'var(--font-tech)', color: 'var(--accent-teal)', fontSize: '22px' }}>
                                {modalMode === 'add' ? 'Post New Update' : 'Edit Bulletin'}
                            </h3>
                            <label className="field-label">Category / Tag</label>
                            <input className="field-input" placeholder="e.g. Company Event, Maintenance Notice" value={form.tag} onChange={(e) => setForm({ ...form, tag: e.target.value })} />

                            <label className="field-label">Title</label>
                            <input className="field-input" placeholder="Bulletin title" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} />

                            <label className="field-label">Image URL</label>
                            <input className="field-input" placeholder="img/example.jpg" value={form.img} onChange={(e) => setForm({ ...form, img: e.target.value })} />

                            <label className="field-label">Description</label>
                            <textarea className="field-textarea" placeholder="Full details of the event or announcement..." value={form.desc} onChange={(e) => setForm({ ...form, desc: e.target.value })}></textarea>

                            <label className="field-label">Date</label>
                            <input className="field-input" placeholder="e.g. August 3, 2026" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />

                            <div className="modal-btn-row">
                                <button className="btn-secondary" onClick={closeModal}>Cancel</button>
                                <button className="btn-primary" style={{ width: 'auto', flex: 1 }} onClick={submitForm}>{modalMode === 'add' ? 'Post Update' : 'Save Changes'}</button>
                            </div>
                        </div>
                    </div>

                    {/* VIEW MODAL */}
                    <div className={`modal-overlay ${modalMode === 'view' ? 'active' : ''}`} onClick={(e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); }}>
                        <div className="modal-content wide">
                            <button className="modal-close" onClick={closeModal}>×</button>
                            {activeBulletin && (
                                <React.Fragment>
                                    <img className="modal-view-img" src={activeBulletin.img} alt={activeBulletin.title} onError={(e) => { e.target.style.display = 'none'; }} />
                                    <div className="modal-view-tag">{activeBulletin.tag}</div>
                                    <h3 style={{ fontFamily: 'var(--font-tech)', color: 'var(--accent-teal)', fontSize: '21px' }}>{activeBulletin.title}</h3>
                                    <p className="modal-view-desc">{activeBulletin.desc}</p>
                                    <div className="modal-view-date">Posted {activeBulletin.date}</div>
                                </React.Fragment>
                            )}
                        </div>
                    </div>

                    {/* DELETE CONFIRM MODAL */}
                    <div className={`modal-overlay ${modalMode === 'delete' ? 'active' : ''}`} onClick={(e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); }}>
                        <div className="modal-content">
                            <button className="modal-close" onClick={closeModal}>×</button>
                            <h3 style={{ fontFamily: 'var(--font-tech)', color: 'var(--accent-teal)', marginBottom: '15px', fontSize: '22px' }}>Delete Bulletin?</h3>
                            <p style={{ fontSize: '13px', marginBottom: '10px', opacity: 0.85 }}>
                                Are you sure you want to delete "{activeBulletin ? activeBulletin.title : ''}"? This action cannot be undone.
                            </p>
                            <div className="modal-btn-row">
                                <button className="btn-secondary" onClick={closeModal}>Cancel</button>
                                <button className="btn-primary" style={{ width: 'auto', flex: 1, background: '#e74c3c' }} onClick={confirmDelete}>Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* --- REACT COMPONENTS --- */
        const TelemetryTicker = () => (
            <div className="ticker-wrap">
                <div className="ticker">
                    <span><strong className="highlight">LIVE STATUS:</strong> AUTOCLAVE 1 <strong>[250°C - NOMINAL]</strong></span>
                    <span>MS YIELD PURITY: <strong>98.4%</strong></span>
                    <span>SCANDIUM FLOW: <strong>OPTIMIZED</strong></span>
                    <span>TAILINGS NEUTRALIZATION: <strong className="highlight">ACTIVE</strong></span>
                    <span>BULK EXPORT BATCH #83: <strong>PREPARING</strong></span>
                    <span>PLANT SAFETY: <strong>0 INCIDENTS LTI</strong></span>
                    <span><strong className="highlight">LIVE STATUS:</strong> AUTOCLAVE 1 <strong>[250°C - NOMINAL]</strong></span>
                    <span>MS YIELD PURITY: <strong>98.4%</strong></span>
                    <span>SCANDIUM FLOW: <strong>OPTIMIZED</strong></span>
                </div>
            </div>
        );

        const NavigationMenu = ({ menuOpen, onNavigate }) => (
            <nav className={`main-nav ${menuOpen ? 'open' : ''}`}>
                <ul className="nav-list">
                    {NAV_DATA.map((nav, idx) => (
                        <li className="nav-item" key={idx}>
                            <a onClick={(e) => { e.preventDefault(); onNavigate(nav.title); }}>
                                <Icon name={nav.icon} /> {nav.title}
                            </a>
                            {nav.dropdown && (
                                <ul className="dropdown">
                                    {nav.dropdown.map((drop, dIdx) => (
                                        <li className={drop.links ? "has-submenu" : ""} key={dIdx}>
                                            <a onClick={(e) => { e.preventDefault(); onNavigate(drop.label); }}>
                                                {drop.label} {drop.links && <Icon name="chevron" className="chevron-icon" />}
                                            </a>
                                            {drop.links && (
                                                <ul className="sub-dropdown">
                                                    {drop.links.map((link, lIdx) => (
                                                        <li key={lIdx}>
                                                            <a onClick={(e) => { e.preventDefault(); onNavigate(link); }}>
                                                                {link}
                                                            </a>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}

        const Header = ({ theme, setTheme, onNavigate, currentUser, onLogout }) => {

                                <h1>THPAL <strong>PRODUCTION</strong></h1>
                                <span className="logo-sub">MS Production Department Operation</span>
                            </div>
