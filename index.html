        const PageRenderer = ({ viewName, onNavigate }) => {
            const componentName = viewName.replace(/[^a-zA-Z0-9]/g, '');
            const ComponentToRender = window[componentName] || window.GenericPage;
            
            return (
                <div className="reveal active" style={{ animation: 'fadeIn 0.5s ease' }}>
                    <div style={{ marginBottom: '20px', fontSize: '12px' }}>
                        <a href="#" onClick={(e) => { e.preventDefault(); onNavigate('Home'); }} style={{ color: 'var(--text-muted)' }}>Home</a> 
                        <span style={{ margin: '0 8px', color: 'var(--border-panel)' }}>/</span> 
                        <span style={{ color: 'var(--accent-pink)', fontWeight: '700' }}>{viewName}</span>
                    </div>
                    <ComponentToRender viewName={viewName} Icon={Icon} />
                </div>
            );
        };

        const HeroSlider = () => {
            const [current, setCurrent] = useState(0);
            const [progress, setProgress] = useState(0);
            const slideDuration = 9000; 
            
            useEffect(() => {
                let startTime = Date.now();
                let animationFrame;
                
                const updateProgress = () => {
                    const elapsed = Date.now() - startTime;
                    const newProgress = (elapsed / slideDuration) * 100;
                    
                    if (newProgress >= 100) {
                        setCurrent(prev => (prev === HERO_SLIDES.length - 1 ? 0 : prev + 1));
                        startTime = Date.now();
                        setProgress(0);
                    } else {
                        setProgress(newProgress);
                    }
                    animationFrame = requestAnimationFrame(updateProgress);
                };
                
                animationFrame = requestAnimationFrame(updateProgress);
                return () => cancelAnimationFrame(animationFrame);
            }, [current]);

            const manualChange = (direction) => {
                if (direction === 'next') setCurrent(prev => (prev === HERO_SLIDES.length - 1 ? 0 : prev + 1));
                if (direction === 'prev') setCurrent(prev => (prev === 0 ? HERO_SLIDES.length - 1 : prev - 1));
                setProgress(0);
            };

            const formatNumber = (num) => (num < 10 ? `0${num}` : num);

            return (
                <section className="slider-wrapper">
                    {HERO_SLIDES.map((slide, idx) => (
                        <div key={idx} className={`slide ${idx === current ? 'active' : ''}`}>
                            <div className="slide-bg">
                                <img src={slide.img} alt={slide.title} />
                            </div>
                            <div className="slide-content">
                                <h2>{slide.title}</h2>
                                <p>{slide.sub}</p>
                            </div>
                        </div>
                    ))}
                    
                    <div className="slider-controls">
                        <div className="slider-counter">
                            {formatNumber(current + 1)} <span>/ {formatNumber(HERO_SLIDES.length)}</span>
                        </div>
                        <div className="slider-nav-btn" onClick={() => manualChange('prev')}><Icon name="arrowLeft" /></div>
                        <div className="slider-nav-btn" onClick={() => manualChange('next')}><Icon name="arrowRight" /></div>
                    </div>
                    <div className="slider-progress-container">
                        <div className="slider-progress-bar" style={{ width: `${progress}%`, transition: progress === 0 ? 'none' : 'width 0.1s linear' }}></div>
                    </div>
                </section>
            );
        };

        /* =========================================
           SECURE NETWORK — LIVE STATUS, MODAL, TOAST
           ========================================= */

        let netToastPushFn = null;
        const NetToastStack = () => {
            const [toasts, setToasts] = useState([]);

            useEffect(() => {
                netToastPushFn = (toast) => {
                    const id = Date.now() + Math.random();
                    setToasts(prev => [...prev, { ...toast, id }]);
                    setTimeout(() => {
                        setToasts(prev => prev.map(t => t.id === id ? { ...t, leaving: true } : t));
                        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 350);
                    }, 3800);
                };
                return () => { netToastPushFn = null; };
            }, []);

            const dismiss = (id) => {
                setToasts(prev => prev.map(t => t.id === id ? { ...t, leaving: true } : t));
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 350);
            };

            return (
                <div className="net-toast-stack">
                    {toasts.map(t => (
                        <div className={`net-toast ${t.leaving ? 'leaving' : ''}`} key={t.id}>
                            <div className="net-toast-icon"><Icon name={t.icon || 'check'} /></div>
                            <div className="net-toast-text">
                                <div className="net-toast-title">{t.title}</div>
                                {t.sub && <div className="net-toast-sub">{t.sub}</div>}
                            </div>
                            <button className="net-toast-close" onClick={() => dismiss(t.id)}>×</button>
                        </div>
                    ))}
                </div>
            );
        };
        const pushNetToast = (toast) => { if (netToastPushFn) netToastPushFn(toast); };

        const WIFI_NETWORKS = [
            { id: 'wf1', name: 'THPAL-CORP-SECURE', type: 'wifi', secured: true, strength: 4, meta: 'WPA3 · 5GHz · Main Office' },
            { id: 'wf2', name: 'THPAL-OPS-FLOOR2', type: 'wifi', secured: true, strength: 3, meta: 'WPA2 · 2.4GHz · Plant Floor' },
            { id: 'wf3', name: 'THPAL-GUEST', type: 'wifi', secured: false, strength: 2, meta: 'Open · 2.4GHz · Visitors' },
            { id: 'wf4', name: 'THPAL-IT-BACKBONE', type: 'wifi', secured: true, strength: 4, meta: 'WPA3-Enterprise · 5GHz' },
        ];
        const BLUETOOTH_DEVICES = [
            { id: 'bt1', name: 'Zebra Handheld Scanner', type: 'bluetooth', secured: true, strength: 3, meta: 'Paired · Inventory Unit 04' },
            { id: 'bt2', name: 'Logi MX Keys (Ops Desk)', type: 'bluetooth', secured: true, strength: 4, meta: 'Paired · Peripheral' },
            { id: 'bt3', name: 'JBL Site Speaker', type: 'bluetooth', secured: false, strength: 2, meta: 'Available · Break Room' },
        ];
        const PORT_CONNECTIONS = [
            { id: 'pt1', name: 'Ethernet — LAN Port 1', type: 'port', secured: true, strength: 4, meta: '1 Gbps · RJ45 · Server Rack A' },
            { id: 'pt2', name: 'USB-C Data Terminal', type: 'port', secured: true, strength: 3, meta: 'Console Station 02' },
            { id: 'pt3', name: 'Serial COM3 — PLC Link', type: 'port', secured: true, strength: 3, meta: 'Autoclave Controller' },
        ];

        const APP_SEEDS = [
            { name: 'Portal Access Auth', tag: 'PA' }, { name: 'GIS Facility Map', tag: 'GM' },
            { name: 'Bulletin Board Sync', tag: 'BB' }, { name: 'Loyalty Awardees DB', tag: 'LA' },
            { name: 'Operational Calendar', tag: 'OC' }, { name: 'HPAL Telemetry Feed', tag: 'HT' },
            { name: 'Safety Compliance API', tag: 'SC' }, { name: 'HR Directory Cache', tag: 'HR' },
        ];

        const SignalBars = ({ level }) => (
            <div className="netconn-signal">
                {[1, 2, 3, 4].map(i => (
                    <div key={i} className={`netconn-signal-bar ${i <= level ? 'filled' : ''}`} style={{ height: `${i * 3 + 2}px` }}></div>
                ))}
            </div>
        );

        const NetConnRow = ({ item, connectedIds, connectingId, onToggle }) => {
            const isConnected = connectedIds.has(item.id);
            const isConnecting = connectingId === item.id;
            const iconMap = { wifi: 'wifi', bluetooth: 'bluetooth', port: 'port' };
            return (
                <div className={`netconn-row ${isConnected ? 'is-connected' : ''}`}>
                    <div className="netconn-icon-wrap"><Icon name={iconMap[item.type]} /></div>
                    <div className="netconn-info">
                        <div className="netconn-name">
                            {item.name}
                            {item.secured && <span className="netconn-lock"><Icon name="lock" /></span>}
                        </div>
                        <div className="netconn-meta">{item.meta}</div>
                    </div>
                    <SignalBars level={item.strength} />
                    <button
                        className={`netconn-btn ${isConnected ? 'connected' : ''} ${isConnecting ? 'connecting' : ''}`}
                        onClick={() => onToggle(item)}
                    >
                        {isConnecting ? 'Connecting…' : isConnected ? 'Connected' : 'Connect'}
                    </button>

            );
        };

        const NetworkModal = ({ open, onClose }) => {
            const [activeTab, setActiveTab] = useState('apps');
            const [connectedIds, setConnectedIds] = useState(() => new Set(['wf1', 'pt1']));
            const [connectingId, setConnectingId] = useState(null);
            const [apps, setApps] = useState(() => APP_SEEDS.map(a => ({ ...a, mbps: (Math.random() * 4 + 0.5).toFixed(1) })));

            useEffect(() => {
                if (!open) return;
                const interval = setInterval(() => {
                    setApps(prev => prev.map(a => ({ ...a, mbps: Math.max(0.1, parseFloat(a.mbps) + (Math.random() - 0.5) * 0.8).toFixed(1) })));
                }, 2000);
                return () => clearInterval(interval);
            }, [open]);

            useEffect(() => {
                const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
                if (open) window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, [open, onClose]);

            const handleToggle = (item) => {
                const alreadyConnected = connectedIds.has(item.id);
                if (alreadyConnected) {
                    setConnectedIds(prev => { const next = new Set(prev); next.delete(item.id); return next; });
                    pushNetToast({ icon: 'security', title: `Disconnected from ${item.name}`, sub: 'Connection closed safely.' });
                    return;
                }
                setConnectingId(item.id);
                setTimeout(() => {
                    setConnectedIds(prev => new Set(prev).add(item.id));
                    setConnectingId(null);
                    const iconMap = { wifi: 'wifi', bluetooth: 'bluetooth', port: 'port' };
                    pushNetToast({ icon: iconMap[item.type], title: 'You are now connected!', sub: item.name });
                }, 900);
            };

            const tabs = [
                { id: 'apps', label: 'Live Apps', icon: 'globe', count: apps.length },
                { id: 'wifi', label: 'Wi-Fi', icon: 'wifi', count: WIFI_NETWORKS.length },
                { id: 'bluetooth', label: 'Bluetooth', icon: 'bluetooth', count: BLUETOOTH_DEVICES.length },
                { id: 'port', label: 'Ports', icon: 'port', count: PORT_CONNECTIONS.length },
            ];

            const listForTab = { wifi: WIFI_NETWORKS, bluetooth: BLUETOOTH_DEVICES, port: PORT_CONNECTIONS };

            return (
                <div className={`modal-overlay ${open ? 'active' : ''}`} onClick={(e) => { if (e.target.classList.contains('modal-overlay')) onClose(); }}>
                    <div className="modal-content network-modal">
                        <button className="modal-close" onClick={onClose}>×</button>
                        <div className="netmodal-header">
                            <div className="netmodal-title"><Icon name="security" /> Secure Network</div>
                        </div>
                        <div className="netmodal-sub">Real-time view of everything linked to this network.</div>

                        <div className="netmodal-tabs">
                            {tabs.map(t => (
                                <button key={t.id} className={`netmodal-tab ${activeTab === t.id ? 'active' : ''}`} onClick={() => setActiveTab(t.id)}>
                                    <Icon name={t.icon} /><span className="netmodal-tab-label">{t.label}</span>
                                    <span className="netmodal-tab-badge">{t.count}</span>
                                </button>
                            ))}
                        </div>

                        <div className="netmodal-body">
                            {activeTab === 'apps' && (
                                <React.Fragment>
                                    <div className="netmodal-section-label">Applications Connected — Real-Time</div>
                                    {apps.map((a, i) => (
                                        <div className="netapp-row" key={i}>
                                            <div className="netapp-icon">{a.tag}</div>
                                            <div className="netapp-info">
                                                <div className="netapp-name">{a.name}</div>
                                                <div className="netapp-meta">Active session · This network</div>
                                            </div>
                                            <div style={{ textAlign: 'right' }}>
                                                <div className="netapp-bandwidth">{a.mbps} Mbps</div>
                                                <div className="netapp-bandwidth-label">live</div>
                                            </div>
                                        </div>
                                    ))}
                                </React.Fragment>
                            )}
                            {activeTab !== 'apps' && (
                                <React.Fragment>
                                    <div className="netmodal-section-label">
                                        {activeTab === 'wifi' ? 'Available Wi-Fi Networks' : activeTab === 'bluetooth' ? 'Nearby Bluetooth Devices' : 'Port Connections'}
                                    </div>
                                    {listForTab[activeTab].map(item => (
                                        <NetConnRow key={item.id} item={item} connectedIds={connectedIds} connectingId={connectingId} onToggle={handleToggle} />
                                    ))}
                                </React.Fragment>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const NetworkSecurityWidget = () => {
            const [modalOpen, setModalOpen] = useState(false);
            const [metrics, setMetrics] = useState({ ping: 12, throughput: 84.3, devices: 14 });
            const [pulseKey, setPulseKey] = useState(0);

            useEffect(() => {
                const interval = setInterval(() => {
                    setMetrics(prev => ({
                        ping: Math.max(4, Math.min(45, prev.ping + Math.round((Math.random() - 0.5) * 6))),
                        throughput: Math.max(20, Math.min(120, parseFloat((prev.throughput + (Math.random() - 0.5) * 8).toFixed(1)))),
                        devices: Math.max(6, Math.min(22, prev.devices + Math.round((Math.random() - 0.5) * 2)))
                    }));
                    setPulseKey(k => k + 1);
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            return (
                <React.Fragment>
                    <div className="netstat-card" onClick={() => setModalOpen(true)}>
                        <div className="netstat-top-row">
                            <div className="netstat-title"><Icon name="security" /> Secure Network</div>
                            <div className="netstat-live-pill"><span className="netstat-live-dot"></span>Live</div>
                        </div>
                        <div className="netstat-metrics" key={pulseKey}>
                            <div className="netstat-metric">
                                <div className="netstat-metric-val">{metrics.ping}ms</div>
                                <div className="netstat-metric-label">Ping</div>
                            </div>
                            <div className="netstat-metric">
                                <div className="netstat-metric-val">{metrics.throughput}</div>
                                <div className="netstat-metric-label">Mbps</div>
                            </div>
                            <div className="netstat-metric">
                                <div className="netstat-metric-val">{metrics.devices}</div>
                                <div className="netstat-metric-label">Devices</div>
                            </div>
                        </div>
                        <div className="netstat-foot-row">
                            <div>Status: <span className="netstat-count">Encrypted &amp; Stable</span></div>
                            <div className="netstat-view-link">View Details <Icon name="arrowRight" /></div>
                        </div>
                    </div>
                    <NetworkModal open={modalOpen} onClose={() => setModalOpen(false)} />
                </React.Fragment>
            );
        };

        /* =========================================
           AUTHENTICATION INTEGRATION
           ========================================= */
        const AuthSection = ({ currentUser, onLogin, onLogout }) => {
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [regOpen, setRegOpen] = useState(false);
            const [regData, setRegData] = useState({
                fullName: '', username: '', password: '', department: 'Production', role: ''
            });

            useEffect(() => {
                const handleEsc = (e) => { if (e.key === 'Escape') setRegOpen(false); };
                if (regOpen) window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, [regOpen]);

            const handleLogin = async () => {
                if (!loginUsername || !loginPassword) {
                    pushNetToast({ icon: 'security', title: 'Login Error', sub: 'Username and password required.' });
                    return;
                }
                setLoading(true);
                try {
                    const res = await fetch('http://127.0.0.1:5000/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: loginUsername, password: loginPassword })
                    });
                    const data = await res.json();
                    if (data.user) {
                        onLogin(data.user);
                        pushNetToast({ icon: 'security', title: 'Login Successful', sub: `Welcome back, ${data.user.fullName}` });
                        setLoginUsername('');
                        setLoginPassword('');
                    } else {
                        pushNetToast({ icon: 'security', title: 'Login Failed', sub: data.error || 'Invalid credentials' });
                    }
                } catch (e) {
                    pushNetToast({ icon: 'security', title: 'Connection Error', sub: 'Could not connect to auth server.' });
                }
                setLoading(false);
            };

            const handleRegister = async () => {
                if (!regData.username || !regData.password || !regData.fullName || !regData.department || !regData.role) {
                    pushNetToast({ icon: 'security', title: 'Registration Error', sub: 'Please fill all fields.' });
                    return;
                }
                setLoading(true);
                try {
                    const res = await fetch('http://127.0.0.1:5000/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(regData)
                    });
                    const data = await res.json();
                    if (data.success) {
                        pushNetToast({ icon: 'check', title: 'Registration Successful', sub: 'You can now log in.' });
                        setRegOpen(false);
                        setRegData({ fullName: '', username: '', password: '', department: 'Production', role: '' });
                    } else {
                        pushNetToast({ icon: 'security', title: 'Registration Failed', sub: data.error || 'Error registering account.' });
                    }
                } catch (e) {
                    pushNetToast({ icon: 'security', title: 'Connection Error', sub: 'Could not connect to auth server.' });
                }
                setLoading(false);
            };

            if (currentUser) {
                return (
                    <div className="auth-container">
                        <div className="section-header" style={{ marginBottom: '15px' }}>
                            <h3 style={{ fontSize: '15px' }}><Icon name="profile" /> User Profile</h3>
                        </div>
                        <div style={{ marginBottom: '20px', display: 'flex', alignItems: 'center', gap: '15px' }}>
                            <div style={{ width: '48px', height: '48px', borderRadius: '50%', background: 'var(--accent-teal)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px', fontWeight: 'bold' }}>
                                {currentUser.fullName.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <div style={{ fontSize: '15px', fontWeight: '700', color: 'var(--accent-teal)' }}>{currentUser.fullName}</div>
                                <div style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: '600' }}>{currentUser.department} — {currentUser.role}</div>
                            </div>
                        </div>
                        <button className="btn-secondary" style={{ width: '100%', marginBottom: '5px' }} onClick={onLogout}>Logout Securely</button>
                    </div>
                );
            }

            return (
                <React.Fragment>
                    <div className="auth-container">
                        <div className="section-header" style={{ marginBottom: '15px' }}>
                            <h3 style={{ fontSize: '15px' }}><Icon name="security" /> Portal Access</h3>
                        </div>
                        <input type="text" placeholder="Username" value={loginUsername} onChange={e => setLoginUsername(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                        <input type="password" placeholder="Passcode" value={loginPassword} onChange={e => setLoginPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                        <button className="btn-primary" onClick={handleLogin} disabled={loading}>{loading ? 'Authenticating...' : 'Secure Login'}</button>
                        <button className="btn-link" onClick={() => setRegOpen(true)}>Need Access? Register Here</button>
                    </div>

                    <div className={`modal-overlay ${regOpen ? 'active' : ''}`} onClick={(e) => { if(e.target.classList.contains('modal-overlay')) setRegOpen(false) }}>
                        <div className="modal-content wide">
                            <button className="modal-close" onClick={() => setRegOpen(false)}>×</button>
                            <h3 style={{ fontFamily: 'var(--font-tech)', color: 'var(--accent-teal)', marginBottom: '20px', fontSize: '24px' }}>Request Portal Access</h3>
                            
                            <label className="field-label">Full Name</label>
                            <input className="field-input" type="text" placeholder="e.g. John Doe" value={regData.fullName} onChange={e => setRegData({...regData, fullName: e.target.value})} />
                            
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px' }}>
                                <div>
                                    <label className="field-label">Username</label>
                                    <input className="field-input" type="text" placeholder="Username" value={regData.username} onChange={e => setRegData({...regData, username: e.target.value})} />
                                </div>
                                <div>
                                    <label className="field-label">Password</label>
                                    <input className="field-input" type="password" placeholder="••••••••" value={regData.password} onChange={e => setRegData({...regData, password: e.target.value})} />
                                </div>
                            </div>
                            
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px' }}>
                                <div>
                                    <label className="field-label">Department</label>
                                    <select className="field-select" value={regData.department} onChange={e => setRegData({...regData, department: e.target.value})}>
                                        <option value="Admin">Admin</option>
                                        <option value="HR">HR</option>
                                        <option value="IT">IT</option>
                                        <option value="GA">GA</option>
                                        <option value="Finance">Finance</option>
                                        <option value="Production">Production</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="field-label">Role</label>
                                    <input className="field-input" type="text" placeholder="e.g. Staff" value={regData.role} onChange={e => setRegData({...regData, role: e.target.value})} />
                                </div>
                            </div>
                            
                            <div className="modal-btn-row">
                                <button className="btn-secondary" onClick={() => setRegOpen(false)}>Cancel</button>
                                <button className="btn-primary" style={{ width: 'auto', flex: 1 }} onClick={handleRegister} disabled={loading}>{loading ? 'Submitting...' : 'Create Account'}</button>
                            </div>
                        </div>
                    </div>
                </React.Fragment>
            );
        };

        const Sidebar = ({ currentUser, onLogin, onLogout }) => {
            const [selectedDate, setSelectedDate] = useState(null);

            const calendarDays = [
                { num: 26, past: true }, { num: 27, past: true }, { num: 28, past: true }, { num: 29, past: true }, { num: 30, past: true }, { num: 31, past: true },
                { num: 1, past: true, shift: 'ms' }, { num: 2, past: true, shift: 'hpal' }, { num: 3, current: true }, { num: 4, shift: 'ms' },
                { num: 5, shift: 'hpal' }, { num: 6 }, { num: 7 }, { num: 8 }, { num: 9 }, { num: 10 }, { num: 11 }, { num: 12 }, { num: 13 }, { num: 14 }, { num: 15 }
            ];

            const calDetailsData = {
                1: { title: "MixSulphide Maintenance", info: "Routine check of bagging plant filters." },
                2: { title: "HPAL Pressure Letdown", info: "Letdown vessel #2 recalibration." },
                3: { title: "Current Operations", info: "All autoclaves running at 250°C optimally. No LTI recorded." },
                4: { title: "MS Circuit Review", info: "Scheduled purity assay from lab." },
                5: { title: "HPAL Acid Lines", info: "Flow meter adjustments on line 3." }
            };

            const handleDateClick = (d) => setSelectedDate(d.num);

            return (
                <div className="content-panel reveal">
                    <AuthSection currentUser={currentUser} onLogin={onLogin} onLogout={onLogout} />

                    <NetworkSecurityWidget />

                    <div className="section-header">
                        <h3><Icon name="calendar" /> Operational Schedule</h3>
                    </div>
                    <div style={{ marginBottom: '15px', color: 'var(--accent-pink)', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '1px' }}>August 2026</div>
                    
                    <div className="calendar-grid">
                        {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => <div className="day-name" key={`head-${i}`}>{d}</div>)}
                        {calendarDays.map((d, i) => (
                            <div className={`day ${d.past ? 'past' : ''} ${d.current ? 'current' : ''}`} key={i} onClick={() => handleDateClick(d)}>
                                {d.num}
                                {d.shift && <div className={`shift-dot shift-${d.shift}`}></div>}
                            </div>
                        ))}
                    </div>

                    <div className={`calendar-details ${selectedDate ? 'active' : ''}`}>
                        <h4 style={{ color: 'var(--accent-pink)', fontSize: '14px', marginBottom: '5px' }}>
                            {selectedDate && calDetailsData[selectedDate] ? calDetailsData[selectedDate].title : `August ${selectedDate}, 2026`}
                        </h4>
                        <p style={{ fontSize: '12px', margin: 0, color: 'var(--text-main)' }}>
                            {selectedDate && calDetailsData[selectedDate] ? calDetailsData[selectedDate].info : "Standard operations. No major events scheduled."}
                        </p>
                    </div>
                </div>
            );
        };

        /* =========================================
           LOYALTY AWARDEES & BIRTHDAYS DIRECTORY
           ========================================= */

        const FIRST_NAMES = [
            "Juan", "Maria", "Jose", "Ana", "Pedro", "Carmen", "Ramon", "Rosa", "Antonio", "Elena",
            "Miguel", "Teresa", "Francisco", "Luz", "Rafael", "Josefa", "Ricardo", "Angelica", "Eduardo", "Cristina",
            "Manuel", "Beatriz", "Roberto", "Victoria", "Fernando", "Isabel", "Alberto", "Patricia", "Ernesto", "Gloria",
            "Danilo", "Corazon", "Romeo", "Leonora", "Arturo", "Remedios", "Cesar", "Amelia", "Rodolfo", "Perla",
            "Nestor", "Julieta", "Marlon", "Rowena", "Bienvenido", "Divina", "Reynaldo", "Marites", "Gilbert", "Analyn"
        ];
        const LAST_NAMES = [
            "Santos", "Reyes", "Cruz", "Bautista", "Gonzales", "Ramos", "Mendoza", "Torres", "Flores", "Villanueva",
            "Castro", "Garcia", "Rivera", "Aquino", "Fernandez", "Domingo", "Marquez", "Salazar", "Del Rosario", "Navarro",
            "Pascual", "Aguilar", "Espino", "Manalo", "Tolentino", "Balagtas", "Cabrera", "Ocampo", "Diaz", "Valdez",
            "Rosales", "Molina", "Guerrero", "Miranda", "Alonzo", "Sarmiento", "Ignacio", "Padilla", "De Leon", "Quiambao"
        ];
        const DEPARTMENTS = [
            "HPAL Process Plant", "Autoclave Operations", "Mine Site Operations", "Environmental Compliance",
            "Safety & Health (OSH)", "Quality Assurance Lab", "Community Relations (SDMP)", "Logistics & Supply Chain",
            "Maintenance & Reliability", "Human Resources", "Finance & Accounting", "Security Services",
            "Scandium Recovery Unit", "Tailings Management", "Corporate Affairs", "IT & Systems"
        ];
        const AWARD_TIERS = [
            { label: "25 Years", cls: "tag-pink" }, { label: "20 Years", cls: "tag-pink" },
            { label: "15 Years", cls: "" }, { label: "10 Years", cls: "" }, { label: "5 Years", cls: "tag-cyan" }
        ];
        const BIRTH_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        const seededRand = (seed) => {
            const x = Math.sin(seed * 999) * 10000;
            return x - Math.floor(x);
        };

        const generateEmployees = (count, mode) => {
            const list = [];
            for (let i = 0; i < count; i++) {
                const seed = i + 1;
                const first = FIRST_NAMES[Math.floor(seededRand(seed * 1.1) * FIRST_NAMES.length)];
                const last = LAST_NAMES[Math.floor(seededRand(seed * 2.3) * LAST_NAMES.length)];
                const dept = DEPARTMENTS[Math.floor(seededRand(seed * 3.7) * DEPARTMENTS.length)];
                const genderSeed = seededRand(seed * 4.9);
                const photoGender = genderSeed > 0.5 ? 'men' : 'women';
                const photoId = Math.floor(seededRand(seed * 5.5) * 99);
                const entry = {
                    id: `${mode}-${seed}`,
                    rank: seed,
                    name: `${first} ${last}`,
                    dept: dept,
                    photo: `https://randomuser.me/api/portraits/${photoGender}/${photoId}.jpg`
                };
                if (mode === 'award') {
                    const tier = AWARD_TIERS[Math.floor(seededRand(seed * 6.1) * AWARD_TIERS.length)];
                    entry.tierLabel = tier.label;
                    entry.tierClass = tier.cls;
                    entry.awardDate = `${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Math.floor(seededRand(seed * 7.3) * 12)]} 2026`;
                    entry.note = `Recognized for ${tier.label.toLowerCase()} of dedicated service and outstanding contribution to THPAL's ${dept} team.`;
                } else {
                    const month = BIRTH_MONTHS[Math.floor(seededRand(seed * 6.1) * 12)];
                    const day = 1 + Math.floor(seededRand(seed * 7.9) * 28);
                    entry.birthMonth = month;
                    entry.birthDay = day;
                    entry.birthDateLabel = `${month} ${day}`;
                    entry.note = `Celebrating another year with the THPAL family. Let's greet ${first} on their special day!`;
                }
                list.push(entry);
            }
            return list;
        };

        const LOYALTY_AWARDEES = generateEmployees(100, 'award');
        const BIRTHDAY_EMPLOYEES = generateEmployees(20, 'birthday');

        const PersonCard = ({ person, mode, index, onSelect }) => (
            <div className="people-card reveal active" style={{ animationDelay: `${(index % 20) * 0.03}s` }} onClick={() => onSelect(person)}>
                <div className="people-photo-wrap">
                    <img src={person.photo} alt={person.name} loading="lazy" />
                    {mode === 'award' && person.rank <= 3 && <div className="people-rank-badge">#{person.rank}</div>}
                </div>
                <div className="people-name">{person.name}</div>
                <div className="people-role">{person.dept}</div>
                {mode === 'award' ? (
                    <span className={`people-tag ${person.tierClass}`}>{person.tierLabel}</span>
                ) : (
                    <span className="people-tag tag-cyan">{person.birthDateLabel}</span>
                )}
            </div>
        );

        const PersonModal = ({ person, mode, onClose }) => (
            <div className={`modal-overlay ${person ? 'active' : ''}`} onClick={(e) => { if (e.target.classList.contains('modal-overlay')) onClose(); }}>
                <div className="modal-content person-modal">
                    <button className="modal-close" onClick={onClose}>×</button>
                    {person && (
                        <React.Fragment>
                            <div className="person-modal-photo">
                                <img src={person.photo} alt={person.name} />
                            </div>
                            <div className="person-modal-name">{person.name}</div>
                            <div className="person-modal-role">{person.dept}</div>
                            {mode === 'award' ? (
                                <span className="person-modal-tag"><Icon name="award" />{person.tierLabel} Loyalty Award</span>
                            ) : (
                                <span className="person-modal-tag"><Icon name="cake" />Birthday: {person.birthDateLabel}</span>
                            )}
                            <div className="person-modal-detail-row">
                                <span className="person-modal-detail-label">Employee No.</span>
                                <span className="person-modal-detail-value">THPAL-{String(person.rank).padStart(4, '0')}</span>
                            </div>
                            <div className="person-modal-detail-row">
                                <span className="person-modal-detail-label">Department</span>
                                <span className="person-modal-detail-value">{person.dept}</span>
                            </div>
                            {mode === 'award' ? (
                                <div className="person-modal-detail-row">
                                    <span className="person-modal-detail-label">Awarded</span>
                                    <span className="person-modal-detail-value">{person.awardDate}</span>
                                </div>
                            ) : (
                                <div className="person-modal-detail-row">
                                    <span className="person-modal-detail-label">Birth Month</span>
                                    <span className="person-modal-detail-value">{person.birthMonth}</span>
                                </div>
                            )}
                            <div className="person-modal-note">{person.note}</div>
                            <div className="modal-btn-row">
                                <button className="btn-secondary" onClick={onClose}>Close</button>
                            </div>
                        </React.Fragment>
                    )}
                </div>
            </div>
        );

        const PAGE_SIZE = 20;

        const PeopleGridSection = ({ title, subtitle, iconName, people, mode, pageSize = PAGE_SIZE }) => {
            const [visibleCount, setVisibleCount] = useState(pageSize);
            const [selectedPerson, setSelectedPerson] = useState(null);

            useEffect(() => {
                const handleEsc = (e) => { if (e.key === 'Escape') setSelectedPerson(null); };
                if (selectedPerson) window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, [selectedPerson]);

            const visiblePeople = people.slice(0, visibleCount);
            const hasMore = visibleCount < people.length;

            const handleSeeMore = () => {
                if (hasMore) {
                    setVisibleCount(prev => Math.min(prev + pageSize, people.length));
                } else {
                    setVisibleCount(pageSize);
                    document.getElementById(`section-${mode}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            return (
                <section className="people-section" id={`section-${mode}`}>
                    <div className="content-panel people-panel reveal">
                        <div className="section-header">
                            <h3><Icon name={iconName} /> {title}<span className="people-count-badge">{people.length} Total</span></h3>
                        </div>
                        <div className="people-subtitle">{subtitle}</div>
                        <div className="people-grid">
                            {visiblePeople.map((person, idx) => (
                                <PersonCard key={person.id} person={person} mode={mode} index={idx} onSelect={setSelectedPerson} />
                            ))}
                        </div>
                        <div className="people-see-more-row">
                            <button className={`people-see-more-btn ${!hasMore ? 'open' : ''}`} onClick={handleSeeMore}>
                                {hasMore ? `See More (${people.length - visibleCount} left)` : 'Show Less'}
                                <Icon name="chevronDown" />
                            </button>
                        </div>
                    </div>
                    <PersonModal person={selectedPerson} mode={mode} onClose={() => setSelectedPerson(null)} />
                </section>
            );
        };

        const LoyaltyAwardeesSection = () => (
            <PeopleGridSection title="List of Loyalty Awardees" subtitle="Honoring the dedication and long-term service of our valued THPAL workforce." iconName="award" people={LOYALTY_AWARDEES} mode="award" />
        );

        const BirthdaysSection = () => (
            <PeopleGridSection title="Employee Birthdays" subtitle="Join us in celebrating the special day of our THPAL family members." iconName="cake" people={BIRTHDAY_EMPLOYEES} mode="birthday" pageSize={5} />
        );

        /* --- MAP SECTION --- */

        const FACILITY_LAYERS = [
            { id: 'evacuation', label: 'Evacuation Route', geomDefault: 'route', color: '#FF69B4' },
            { id: 'fire', label: 'Fire Extinguishers', geomDefault: 'point', color: '#e74c3c' },
            { id: 'h2s', label: 'H2S Detector', geomDefault: 'point', color: '#f1c40f' },
            { id: 'o2', label: 'O2 Detector', geomDefault: 'point', color: '#3498db' },
            { id: 'ram', label: 'Ram Source', geomDefault: 'point', color: '#9b59b6' },
            { id: 'ph', label: 'PH Analyzer', geomDefault: 'point', color: '#2ecc71' },
            { id: 'ditches', label: 'Ditches', geomDefault: 'route', color: '#16a085' },
            { id: 'valve', label: 'Gate Valve', geomDefault: 'point', color: '#e67e22' },
            { id: 'areas', label: "Area's of Operation", geomDefault: 'area', color: '#069494' }
        ];

        const DEFAULT_MAP_ITEMS = {
            evacuation: [
                { id: 'ev1', name: 'Route A: Admin -> North Gate', type: 'route', points: [[9.5447, 125.7925], [9.5460, 125.7910], [9.5480, 125.7890]], center: [9.5460, 125.7910], zoom: 16, notes: 'Primary route from Admin building to North Gate assembly point.' },
                { id: 'ev2', name: 'Route B: Autoclave -> South Assembly', type: 'route', points: [[9.5447, 125.7925], [9.5430, 125.7940], [9.5410, 125.7960]], center: [9.5430, 125.7940], zoom: 16, notes: 'Secondary route from Autoclave deck to South Assembly area.' }
            ],
            fire: [
                { id: 'fx1', name: 'Fire Extinguisher Station 1', type: 'point', points: [[9.5445, 125.7920]], center: [9.5445, 125.7920], zoom: 17, notes: 'Type ABC, inspected monthly.' },
                { id: 'fx2', name: 'Fire Extinguisher Station 2', type: 'point', points: [[9.5450, 125.7930]], center: [9.5450, 125.7930], zoom: 17, notes: 'Type CO2, near Autoclave 2.' },
                { id: 'fx3', name: 'Fire Extinguisher Station 3', type: 'point', points: [[9.5435, 125.7915]], center: [9.5435, 125.7915], zoom: 17, notes: 'Type ABC, near loading dock.' }
            ],
            h2s: [
                { id: 'h1', name: 'H2S Sensor - North', type: 'point', points: [[9.5440, 125.7915]], center: [9.5440, 125.7915], zoom: 17, notes: 'Alarm trigger at 10ppm.' },
                { id: 'h2', name: 'H2S Sensor - East', type: 'point', points: [[9.5442, 125.7945]], center: [9.5442, 125.7945], zoom: 17, notes: 'Alarm trigger at 10ppm.' }
            ],
            o2: [
                { id: 'o1', name: 'O2 Sensor - Autoclave Deck', type: 'point', points: [[9.5460, 125.7940]], center: [9.5460, 125.7940], zoom: 17, notes: 'Confined space monitor.' }
            ],
            ram: [],
            ph: [
                { id: 'p1', name: 'Wastewater pH Analyzer', type: 'point', points: [[9.5420, 125.7900]], center: [9.5420, 125.7900], zoom: 17, notes: 'Continuous discharge monitoring.' }
            ],
            ditches: [],
            valve: [],
            areas: [
                { id: 'a1', name: 'HPAL Main Circuit', type: 'area', points: [[9.5440, 125.7910], [9.5460, 125.7910], [9.5460, 125.7930], [9.5440, 125.7930]], center: [9.5450, 125.7920], zoom: 16, notes: 'High-Pressure Leaching main operational zone.' },
                { id: 'a2', name: 'Scandium Circuit', type: 'area', points: [[9.5500, 125.7980], [9.5520, 125.7980], [9.5520, 125.8000], [9.5500, 125.8000]], center: [9.5510, 125.7990], zoom: 16, notes: 'Scandium extraction and refining zone.' }
            ]
        };

        const emptyMapForm = { name: '', notes: '', type: 'point' };

        const MapSection = () => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const layerGroupRef = useRef(null);
            const pickLayerRef = useRef(null);
            const clickHandlerRef = useRef(null);

            const [activeLayer, setActiveLayer] = useState('evacuation');
            const [mapItems, setMapItems] = useState(DEFAULT_MAP_ITEMS);
            const [mapModal, setMapModal] = useState(null);
            const [activeItem, setActiveItem] = useState(null);
            const [form, setForm] = useState(emptyMapForm);
            const [pickedPoints, setPickedPoints] = useState([]);
            const [isPicking, setIsPicking] = useState(false);

            const activeLayerDef = FACILITY_LAYERS.find(l => l.id === activeLayer) || FACILITY_LAYERS[0];
            const activeItems = mapItems[activeLayer] || [];
// Init map once
            useEffect(() => {
                if (!mapRef.current || mapInstanceRef.current) return;
                const map = L.map(mapRef.current).setView([9.5447, 125.7925], 15);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19, attribution: '&copy; OpenStreetMap'
                }).addTo(map);

                L.marker([9.5447, 125.7925]).addTo(map).bindPopup("<b style='color:#FF69B4; font-family:var(--font-tech); font-size:15px;'>THPAL Main Facility</b>").openPopup();

                layerGroupRef.current = L.layerGroup().addTo(map);
                pickLayerRef.current = L.layerGroup().addTo(map);
                mapInstanceRef.current = map;

                return () => {
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                    }
                };
            }, []);

            // Draw active layer's items whenever items or active layer changes
            const drawLayer = () => {
                if (!layerGroupRef.current) return;
                layerGroupRef.current.clearLayers();
                const items = mapItems[activeLayer] || [];
                items.forEach(item => {
                    let layer;
                    if (item.type === 'point') {
                        layer = L.circleMarker(item.points[0], { radius: 8, color: activeLayerDef.color, fillOpacity: 0.85, weight: 2 });
                    } else if (item.type === 'route') {
                        layer = L.polyline(item.points, { color: activeLayerDef.color, weight: 4 });
                    } else if (item.type === 'area') {
                        layer = L.polygon(item.points, { color: activeLayerDef.color, fillOpacity: 0.2, weight: 2 });
                    }
                    if (layer) {
                        layer.bindPopup(`<b style="color:${activeLayerDef.color}; font-family:var(--font-tech);">${item.name}</b><br/><span style="font-size:12px;">${item.notes || ''}</span>`);
                        layer.on('click', () => { openView(item); });
                        layer.addTo(layerGroupRef.current);
                    }
                });
            };

            useEffect(() => {
                drawLayer();
                // eslint-disable-next-line
            }, [mapItems, activeLayer]);

            // Smooth fly-to whenever the active layer changes
            useEffect(() => {
                if (!mapInstanceRef.current) return;
                const items = mapItems[activeLayer] || [];
                if (items.length > 0) {
                    const allPts = items.flatMap(it => it.points);
                    if (allPts.length === 1) {
                        mapInstanceRef.current.flyTo(allPts[0], 17, { duration: 1.6, easeLinearity: 0.25 });
                    } else if (allPts.length > 1) {
                        const bounds = L.latLngBounds(allPts);
                        mapInstanceRef.current.flyToBounds(bounds, { duration: 1.6, easeLinearity: 0.25, padding: [40, 40] });
                    }
                } else {
                    mapInstanceRef.current.flyTo([9.5447, 125.7925], 15, { duration: 1.4, easeLinearity: 0.25 });
                }
                // eslint-disable-next-line
            }, [activeLayer]);

            // Picking mode: capture map clicks to build point/route/area coordinates
            useEffect(() => {
                const map = mapInstanceRef.current;
                if (!map) return;

                if (clickHandlerRef.current) {
                    map.off('click', clickHandlerRef.current);
                    clickHandlerRef.current = null;
                }

                if (isPicking) {
                    const handler = (e) => {
                        setPickedPoints(prev => {
                            const next = form.type === 'point' ? [[e.latlng.lat, e.latlng.lng]] : [...prev, [e.latlng.lat, e.latlng.lng]];
                            return next;
                        });
                    };
                    clickHandlerRef.current = handler;
                    map.on('click', handler);
                }

                return () => {
                    if (map && clickHandlerRef.current) map.off('click', clickHandlerRef.current);
                };
                // eslint-disable-next-line
            }, [isPicking, form.type]);

            // Draw picked points preview
            useEffect(() => {
                if (!pickLayerRef.current) return;
                pickLayerRef.current.clearLayers();
                if (pickedPoints.length === 0) return;

                pickedPoints.forEach((p, i) => {
                    L.circleMarker(p, { radius: 6, color: '#00F0FF', fillColor: '#00F0FF', fillOpacity: 1, weight: 2 })
                        .bindTooltip(String(i + 1), { permanent: true, direction: 'top', offset: [0, -6] })
                        .addTo(pickLayerRef.current);
                });

                if (form.type === 'route' && pickedPoints.length > 1) {
                    L.polyline(pickedPoints, { color: '#00F0FF', weight: 3, dashArray: '6,6' }).addTo(pickLayerRef.current);
                } else if (form.type === 'area' && pickedPoints.length > 2) {
                    L.polygon(pickedPoints, { color: '#00F0FF', fillOpacity: 0.15, weight: 2, dashArray: '6,6' }).addTo(pickLayerRef.current);
                }
            }, [pickedPoints, form.type]);

            const handleLayerSwitch = (id) => {
                setActiveLayer(id);
            };

            const openAdd = () => {
                const def = FACILITY_LAYERS.find(l => l.id === activeLayer);
                setForm({ ...emptyMapForm, type: def ? def.geomDefault : 'point' });
                setPickedPoints([]);
                setIsPicking(true);
                setMapModal('add');
            };

            const openEdit = (item) => {
                setActiveItem(item);
                setForm({ name: item.name, notes: item.notes || '', type: item.type });
                setPickedPoints(item.points);
                setIsPicking(false);
                setMapModal('edit');
            };

            const openView = (item) => {
                setActiveItem(item);
                setMapModal('view');
            };

            const openDelete = (item) => {
                setActiveItem(item);
                setMapModal('delete');
            };

            const closeModal = () => {
                setMapModal(null);
                setActiveItem(null);
                setForm(emptyMapForm);
                setPickedPoints([]);
                setIsPicking(false);
                if (pickLayerRef.current) pickLayerRef.current.clearLayers();
            };

            const computeCenter = (pts) => {
                if (pts.length === 0) return [9.5447, 125.7925];
                const lat = pts.reduce((s, p) => s + p[0], 0) / pts.length;
                const lng = pts.reduce((s, p) => s + p[1], 0) / pts.length;
                return [lat, lng];
            };

            const submitAdd = () => {
                if (!form.name.trim() || pickedPoints.length === 0) return;
                const newItem = {
                    id: `${activeLayer}-${Date.now()}`,
                    name: form.name,
                    notes: form.notes,
                    type: form.type,
                    points: pickedPoints,
                    center: computeCenter(pickedPoints),
                    zoom: form.type === 'area' ? 16 : 17
                };
                setMapItems(prev => ({ ...prev, [activeLayer]: [...(prev[activeLayer] || []), newItem] }));
                closeModal();
            };

            const submitEdit = () => {
                if (!activeItem || !form.name.trim()) return;
                const pts = pickedPoints.length > 0 ? pickedPoints : activeItem.points;
                setMapItems(prev => ({
                    ...prev,
                    [activeLayer]: prev[activeLayer].map(it => it.id === activeItem.id
                        ? { ...it, name: form.name, notes: form.notes, type: form.type, points: pts, center: computeCenter(pts) }
                        : it)
                }));
                closeModal();
            };

            const confirmDelete = () => {
                if (!activeItem) return;
                setMapItems(prev => ({ ...prev, [activeLayer]: prev[activeLayer].filter(it => it.id !== activeItem.id) }));
                closeModal();
            };

            const flyToItem = (item) => {
                if (!mapInstanceRef.current) return;
                if (item.points.length === 1) {
                    mapInstanceRef.current.flyTo(item.points[0], 18, { duration: 1.4, easeLinearity: 0.25 });
                } else {
                    mapInstanceRef.current.flyToBounds(L.latLngBounds(item.points), { duration: 1.4, easeLinearity: 0.25, padding: [50, 50] });
                }
            };

            const geomLabel = { point: 'Point Location', route: 'Route / Path', area: 'Area / Zone' };

            return (
                <section className="plant-map-section reveal">
                    <div className="content-panel" style={{ padding: 'clamp(15px, 2vw, 25px)', background: '#FFFFFF' }}>
                        <div className="section-header" style={{ marginBottom: '20px' }}>
                            <h3><Icon name="supply" /> Facility GIS Location & Infrastructure</h3>
                        </div>
                        
                        <div className="map-controls">
                            {FACILITY_LAYERS.map(btn => (
                                <button key={btn.id} className={`map-btn ${activeLayer === btn.id ? 'active' : ''}`} onClick={() => handleLayerSwitch(btn.id)}>
                                    {btn.label}
                                    <span className="map-btn-count">{(mapItems[btn.id] || []).length}</span>
                                </button>
                            ))}
                            <div className="map-toolbar-divider"></div>
                            <button className="map-add-btn" onClick={openAdd}>
                                <Icon name="plus" /> Add {geomLabel[activeLayerDef.geomDefault]}
                            </button>
                        </div>

                        <div className="map-interactive-wrapper">
                            <div id="map" ref={mapRef}></div>
                            <div className="map-details-panel">
                                <h4>{activeLayerDef.label}</h4>
                                <p>Manage all mapped items for this layer — add, edit, delete, or view details. Click any list item or map marker to view.</p>

                                <h5 style={{ color: 'var(--accent-teal)', marginBottom: '8px', fontSize: '12px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                    Mapped Items ({activeItems.length})
                                </h5>

                                {activeItems.length === 0 ? (
                                    <div className="map-empty-note">No items mapped yet for this layer. Click "Add {geomLabel[activeLayerDef.geomDefault]}" above to place one.</div>
                                ) : (
                                    <div className="map-item-list">
                                        {activeItems.map(item => (
                                            <div className="map-item-row" key={item.id}>
                                                <div className="map-item-row-main" onClick={() => flyToItem(item)}>
                                                    <div className="map-item-row-name">{item.name}</div>
                                                    <div className="map-item-row-type">{item.type}</div>
                                                </div>
                                                <div className="map-item-row-actions">
                                                    <div className="map-icon-btn" title="View" onClick={() => openView(item)}><Icon name="eye" /></div>
                                                    <div className="map-icon-btn" title="Edit" onClick={() => openEdit(item)}><Icon name="edit" /></div>
                                                    <div className="map-icon-btn danger" title="Delete" onClick={() => openDelete(item)}><Icon name="trash" /></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* ADD / EDIT MODAL */}
                    <div className={`modal-overlay ${(mapModal === 'add' || mapModal === 'edit') ? 'active' : ''}`} onClick={(e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); }}>
                        <div className="modal-content wide">
                            <button className="modal-close" onClick={closeModal}>×</button>
                            <h3 style={{ fontFamily: 'var(--font-tech)', color: 'var(--accent-teal)', fontSize: '21px' }}>
                                {mapModal === 'add' ? `Add New Item — ${activeLayerDef.label}` : `Edit — ${activeItem ? activeItem.name : ''}`}

                            <label className="field-label">Geometry Type</label>
                            <div className="geometry-type-toggle">
                                {['point', 'route', 'area'].map(t => (
                                    <button
                                        key={t}
                                        type="button"
                                        className={`geometry-type-btn ${form.type === t ? 'active' : ''}`}
                                        onClick={() => { setForm({ ...form, type: t }); if (mapModal === 'add') setPickedPoints([]); }}
                                    >
                                        {geomLabel[t]}
                                    </button>
                                ))}
                            </div>

                            <label className="field-label">Name / Label</label>
                            <input className="field-input" placeholder="e.g. Fire Extinguisher Station 4" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />

                            <label className="field-label">Notes</label>
                            <textarea className="field-textarea" placeholder="Additional details, inspection dates, status..." value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })}></textarea>

                            <label className="field-label">Location on Map</label>
                            <div className={`picker-hint ${isPicking ? 'picking' : ''}`}>
                                <Icon name="pin" style={{ width: 14, height: 14, fill: 'currentColor' }} />
                                {isPicking
                                    ? (form.type === 'point' ? 'Click once on the map to place this point.' : `Click on the map to add points (${pickedPoints.length} placed). ${form.type === 'route' ? 'Need at least 2.' : 'Need at least 3.'}`)
                                    : 'Click "Reposition" to pick a new location on the map.'}
                            </div>
                            {pickedPoints.length > 0 && (
                                <div className="coord-readout">{pickedPoints.map(p => `[${p[0].toFixed(4)}, ${p[1].toFixed(4)}]`).join('  ')}</div>
                            )}

                                <button type="button" className="btn-secondary" style={{ padding: '9px', fontSize: '11px' }} onClick={() => setIsPicking(p => !p)}>
                                    {isPicking ? 'Stop Picking' : 'Reposition on Map'}
                                </button>
                                <button type="button" className="btn-secondary" style={{ padding: '9px', fontSize: '11px' }} onClick={() => setPickedPoints([])}>
                                    Clear Points
                                </button>
                            </div>

                            <div className="modal-btn-row">
                                <button className="btn-secondary" onClick={closeModal}>Cancel</button>
                                <button
                                    className="btn-primary"
                                    style={{ width: 'auto', flex: 1 }}
                                    onClick={mapModal === 'add' ? submitAdd : submitEdit}
                                    disabled={!form.name.trim() || (mapModal === 'add' && pickedPoints.length === 0)}
                                >
                                    {mapModal === 'add' ? 'Save New Item' : 'Save Changes'}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* VIEW MODAL */}
                    <div className={`modal-overlay ${mapModal === 'view' ? 'active' : ''}`} onClick={(e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); }}>

                            <button className="modal-close" onClick={closeModal}>×</button>

                                <React.Fragment>
                                    <div className="modal-view-tag">{activeLayerDef.label} — {activeItem.type}</div>

                                        <button className="btn-secondary" onClick={closeModal}>Close</button>
                                        <button className="btn-primary" style={{ width: 'auto', flex: 1 }} onClick={() => { flyToItem(activeItem); closeModal(); }}>Fly To Location</button>
                                    </div>
                                </React.Fragment>
                            )}

                    </div>

                    {/* DELETE CONFIRM MODAL */}
                    <div className={`modal-overlay ${mapModal === 'delete' ? 'active' : ''}`} onClick={(e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); }}>

                                <button className="btn-secondary" onClick={closeModal}>Cancel</button>
                                <button className="btn-primary" style={{ width: 'auto', flex: 1, background: '#e74c3c' }} onClick={confirmDelete}>Delete</button>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [theme, setTheme] = useState('magenta-teal');
            const [bulletins, setBulletins] = useState(DEFAULT_BULLETINS);
            const [currentView, setCurrentView] = useState('Home'); // Routing State
            const [currentUser, setCurrentUser] = useState(null);   // Auth State

            useScrollReveal([bulletins.length, currentView, currentUser]);

            // Scroll to top when view changes
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [currentView]);

            const addBulletin = (b) => setBulletins(prev => [b, ...prev]);
            const editBulletin = (id, updated) => setBulletins(prev => prev.map(b => b.id === id ? { ...b, ...updated } : b));
            const deleteBulletin = (id) => setBulletins(prev => prev.filter(b => b.id !== id));

            const handleLogout = () => {
                setCurrentUser(null);

                                              { icon: "goals", title: "Strategic Goals", text: "1. >98% Mixsulphide Yield Purity.\n2. Zero-Harm in safety.\n3. 100% compliance.", color: "var(--accent-teal)" }
                                            ].map((card, idx) => (
                                                <div className="mvg-card reveal" key={idx}>
                                                    <Icon name={card.icon} style={{ fill: card.color }} />
                                                    <h4>{card.title}</h4>
                                                    <p style={{ whiteSpace: 'pre-line' }}>{card.text}</p>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="section-header reveal" style={{ marginTop: '20px' }}>
                                            <h3><Icon name="operations2" /> Detailed Corporate Operations</h3>
                                        </div>
                                        <div className="details-grid">
                                            {[
                                                { icon: "operations", title: "HPAL Technology Leadership", text: "Subjecting low-grade limonite ore to concentrated sulfuric acid at 250°C and 50 bar inside titanium-lined autoclaves separates critical nickel and cobalt from iron." },
                                                { icon: "quality", title: "Environmental Stewardship", text: "Strict ISO 14001 compliance. We actively neutralize chemical residues, managing sophisticated Tailings Storage Facilities and progressive mine rehabilitation." },
                                                { icon: "Systems", title: "Community & Social Impact", text: "We fund comprehensive SDMP projects for regional infrastructure, education, and healthcare, maximizing local employment in Claver, Surigao del Norte." },
                                                { icon: "supply", title: "Global Supply Chain", text: "Our Mixed Nickel-Cobalt Sulphide (MS), alongside Scandium and Chromite, forms the essential backbone for the global EV battery manufacturing sector." }
                                            ].map((info, idx) => (
                                                <div className="info-paragraph reveal" key={idx}>
                                                    <h4><Icon name={info.icon} /> {info.title}</h4>
                                                    <p>{info.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <Sidebar currentUser={currentUser} onLogin={setCurrentUser} onLogout={handleLogout} />
                            </main>
                            <LoyaltyAwardeesSection />
                            <BirthdaysSection />
                            <MapSection />
                        </React.Fragment>
                    ) : (
                        <main style={{ padding: 'clamp(20px, 4vw, 40px) clamp(20px, 4vw, 45px)', minHeight: '70vh' }}>
                            <PageRenderer viewName={currentView} onNavigate={setCurrentView} />
                        </main>
                    )}
                    
                    <footer className="reveal">
                        <div className="footer-grid">
                            <div className="foot-col">
                                <h4>TAGANITO HPAL NICKEL CORP</h4>
                                <p>Extracting critical battery minerals for a sustainable, electrified global future.</p>
                                <p style={{ marginTop: '10px', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '1px', fontWeight: '700', color: 'var(--accent-pink)' }}>Claver, Surigao del Norte, Philippines</p>
                            </div>
                            <div className="foot-col">
                                <h4>Explore</h4>
                                <a href="#">HPAL Process</a>
                                <a href="#">Scandium Recovery</a>
                            </div>
                            <div className="foot-col">
                                <h4>Commitments</h4>
                                <a href="#">ISO 14001</a>
                                <a href="#">Community SDMP</a>
                            </div>
                            <div className="foot-col">
                                <h4>Support</h4>
                                <p>Secure network designated for integrated logistics teams.</p>
                            </div>
                        </div>
                        <div style={{ borderTop: '1px solid var(--border-light)', paddingTop: '20px', textAlign: 'center', fontSize: '12px', color: 'var(--text-muted)' }}>
                            &copy; 2026 Taganito HPAL Nickel Corporation. All rights reserved.
                        </div>
                    </footer>
                    <NetToastStack />
                </div>
            );
        };

        root.render(<App />);
    </script>
